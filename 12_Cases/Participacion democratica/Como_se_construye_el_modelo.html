<title>Cómo se construye el modelo</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Calibri, "Segoe UI", Arial, sans-serif; color:#1F2933; background:#F7F9FB; font-size:15px; }
  header { padding:12px 20px; background:#12355B; color:#fff; }

  .chip { flex:none; font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; color:#fff; white-space:nowrap; }
  .n-FIRME { background:#12355B; } .n-APOYO { background:#2B6CB0; } .n-DEBIL { background:#7B8794; } .n-H { background:#fff; color:#52606D; border:1px dashed #7B8794; } .n-PENDIENTE { background:#fff; color:#52606D; border:1px dashed #7B8794; } .n-DATO { background:#52606D; } .n-C { background:#52606D; } .n-NOHAY { background:#fff; color:#9B2C2C; border:1px dashed #9B2C2C; }
  #ficha { border:1px solid #12355B; border-radius:6px; padding:10px 12px; background:#fff; font-size:13.5px; line-height:1.4; display:none; }
  #ficha.ver { display:block; }
  #ficha b.t { display:block; font-size:14.5px; margin-bottom:4px; color:#12355B; }
  #ficha dl { margin:6px 0 0; display:grid; grid-template-columns: 92px 1fr; gap:3px 8px; }
  #ficha dt { color:#52606D; } #ficha dd { margin:0; }
  #nav { display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:12px; border-top:1px solid #EEF1F4; }
  #nav button { font:inherit; font-weight:700; padding:8px 16px; border-radius:18px; border:1px solid #12355B; cursor:pointer; }
  #ant { background:#fff; color:#12355B; } #sig { background:#12355B; color:#fff; margin-left:auto; }
  #nav button:disabled { opacity:.35; cursor:default; }
  #puntos { display:flex; gap:4px; flex-wrap:wrap; }
  #puntos span { width:9px; height:9px; border-radius:50%; background:#CBD2D9; cursor:pointer; }

  footer { font-size:12px; color:#52606D; padding:10px 20px 16px; background:#F7F9FB; border-top:1px solid #CBD2D9; line-height:1.45; }
  footer a { color:#1F5A8A; }
  svg text { font-family: Calibri, "Segoe UI", Arial, sans-serif; }
  .nodo, .enlace { transition: opacity .35s; }
  .enlace { cursor:pointer; }
  @media (max-width: 900px) {
    #cuerpo { grid-template-columns: minmax(0,1fr); min-height:0; }
    #lienzo-caja { border-right:0; border-bottom:1px solid #CBD2D9; min-width:0; }
    #lienzo-scroll { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    #lienzo { width:880px; max-width:none; }
    #desliza { display:block; }
    #panel { padding:14px 14px 18px; }
    #panel h2 { font-size:20px; }
    #nav { position:sticky; bottom:0; background:#F7F9FB; padding:10px 0; }
  }
</style>

tinivel)","ambito":"UE y otros (con ES 1986-96)","fuente":"Solt (2008), AJPS 52(1)","lectura":"texto completo (preprint 2007)","contra":"","ref":"R164 en la ficha de relaciones","curva":0.1},{"id":"R271","de":"L48","a":"P01","nivel":"APOYO","signo":"+","signoCorto":"+","etDe":"Confianza en las instituciones políticas","etA":"Participación electoral total","mecanismo":"Quien desconfía del Parlamento y de los partidos se abstiene algo más, dentro de la misma persona el efecto es pequeño y la relación va también al revés (abstenerse baja la confianza)","retardo":"menos de un año","tipo":"correlacional (panel con efectos fijos individuales y retardos cruzados en España, postelectorales CIS, panel within-between en Países Bajos, metaanálisis)","ambito":"ES (panel 2010-2020, 5 generales, postelectorales 2015 y 2016) y otro país (Países Bajos, ESS 25 países)","fuente":"Cálculo propio panel POLAT 2010-2020 (polat_confianza_participacion.js), cálculo propio CIS 3126 y 3145 (confianza_participacion_cis.js), Orriols y Cordero (2016) SESP 21(4) tabla A1, van Alebeek, van der Meer y Hakhverdian (2025) EPSR 18, Hooghe y Marien (2013) European Societies 15(1), Devine (2024) Political Behavior 46","lectura":"texto completo (microdatos completos, Hooghe y Marien: versión aceptada sin revisión teórica)","contra":"POLAT: con efectos fijos la confianza en Parlamento y partidos medida antes de la elección no predice la abstención declarada (-0,31 pp, IC95 -0,88 a 0,26, con Gobierno -0,4 y políticos -0,56 sí, al límite). Kostelka y Blais (2018): la satisfacción antes de la elección no predice el voto. Devine (2024): r parcial 0,06. CIS 3420: citar la política como problema no cambia la abstención","ref":"R271 en la ficha de relaciones. Nota: POLAT, efectos fijos: -1,08 pp de intención de no votar por punto de confianza (IC95 -1,55 a -0,62), algo más de un tercio del efecto transversal (-2,85), retardos cruzados: -0,82 pp de abstención voluntaria por punto (IC95 -1,13 a -0,51), estandarizado -0,056, igual de fuerte que el sentido inverso (R296). CIS 2016: −2,6 pp por punto (transversal). Panel no probabilístico y participación declarada","curva":0.2},{"id":"R296","de":"P01","a":"L48","nivel":"APOYO","signo":"+","signoCorto":"+","etDe":"Participación electoral total","etA":"Confianza en las instituciones políticas","mecanismo":"Votar (frente a abstenerse) deja después más confianza en el Parlamento y los partidos, abstenerse la baja","retardo":"menos de un año","tipo":"panel con retardos cruzados (correlacional)","ambito":"ES (5 generales, 2011-2019, panel en línea no probabilístico)","fuente":"Cálculo propio panel POLAT 2010-2020 (polat_confianza_participacion.js)","lectura":"texto completo (microdatos completos)","contra":"Con efectos fijos, abstenerse frente a votar al partido tradicional perdedor da -0,41 (IC95 -0,85 a 0,03): tamaño parecido pero no distinguible de cero, la subida más clara es la de quien vota al ganador (+0,75 con efectos fijos)","ref":"R296 en la ficha de relaciones. Nota: Abstención voluntaria → confianza posterior -0,27 puntos (IC95 -0,42 a -0,13) con la confianza anterior controlada, estandarizado -0,039 frente a -0,056 en el sentido R271. Con R271 forma un bucle de refuerzo L48 → P01 → L48. Votar al partido tradicional ganador: +0,48 frente al perdedor | 26/10/2026, artefacto de bloque_inestable.md sección 6: nota de agregación. Con retardos cruzados, abstenerse → −0,27 (significativo), con efectos fijos frente al perdedor −0,41 (IC95 −0,85 a 0,03), el resto es efecto ganador (+0,75), que no se suma en agregado. Consecuencia: el signo se mantiene, el peso debe tomar la cota inferior en la calibración","curva":0.2},{"id":"R249","de":"L27","a":"L48","nivel":"FIRME","signo":"−","signoCorto":"−","etDe":"Escándalos de corrupción revelados","etA":"Confianza en las instituciones políticas","mecanismo":"Un escándalo local hace que en torno al 7 % pase de confianza alta a baja","retardo":"menos de un año","tipo":"causal (emparejamie ":"R087","de":"S16","a":"S22","nivel":"APOYO","signo":"+","signoCorto":"+","etDe":"Agravio y sensación de ser despreciado","etA":"Protesta","mecanismo":"La injusticia percibida lleva a protestar","retardo":"","tipo":"correlacional","ambito":"ES","fuente":"Sabucedo et al. (2017), Front. Psychol. 8","lectura":"texto completo (equipo de apoyo)","contra":"","ref":"R087 en la ficha de relaciones. Nota: La ira no se mide | S22 separada el 25/10/2026: la fuente mide protesta, se queda en S22"},{"id":"R293","de":"S22","a":"P01","nivel":"APOYO","signo":"+","signoCorto":"+","etDe":"Protesta","etA":"Participación electoral total","mecanismo":"Participar en la protesta (15M) aumentó la intención de votar","retardo":"menos de un año","tipo":"panel con efectos fijos individuales (correlacional)","ambito":"ES (internautas de 16 a 44 años, 2010-2012)","fuente":"Galais (2014) JEPOP 24(3)","lectura":"texto completo salvo la tabla 1 (imagen)","contra":"Casanueva Artís (2022) tabla 2 col. 7: entre ciudades, la asistencia a las marchas del 15M no cambia la abstención (−0,53, e. t. 0,61)","ref":"R293 en la ficha de relaciones. Nota: La protesta no sustituye al voto en España. Misma fuente que R063 | S22 separada el 25/10/2026: la fuente mide protesta, se queda en S22 | Flecha de vuelta R529 (P01 → S22) desde el 14/11/2026"},{"id":"R152","de":"P06","a":"P39","nivel":"APOYO","signo":"+ (condicional: solo con participación baja, < 40-50 %, sin medir en ES)","signoCorto":"+?","etDe":"Brecha de participación por renta del barrio","etA":"Respuesta desigual de las políticas","mecanismo":"Si los de abajo votan menos, los representantes atienden menos sus preferencias","retardo":"de uno a cuatro años","tipo":"correlacional (ninguno causal)","ambito":"UE (25 países con ES, 2002-2010, 30 países europeos con ES, 52 países con ES hasta 2015), ES (CIS 2016-2023)","fuente":"Peters y Ensink (2015), WEP 38(3): 577-600, tablas 5-6, Schakel (2021), SER 19(1), p. 50, Lupu y Warner (2022), EJPR 61(1), fig. 2, Persson y Sundell (2024), BJPolS 54(2), tabla 2, Lupu y Tirado Castro (2023), SER 21(3), p. 1712, cálculo propio CIS 2016-2023 (respuesta_desigual_2016_2023.js)","lectura":"texto completo","contra":"Persson y Sundell: −4,497 (n.s.), Lupu y Warner: la participación tiene importancia media y no está entre las causas principales, Hoffman et al. (2016): voto obligatorio sin efecto en el gasto, Schakel: importa más tener renta alta que votar, cálculo propio 2016-2022: con participación desigual medida no aparece respuesta desigual (brecha de estudios −0,003, e. t. 0,024, 30 propuestas, potencia 23 %)","ref":"R152 en la ficha de relaciones. Nota: Se retira «≈0 en ES»: Lupu y Tirado no estiman el efecto, lo deducen de una premisa (voto sin sesgo por estudios, CSES 1976-2016) que no se cumple en 2016-2023 (CIS postelectorales: abstención Q1 − Q5 de 13,1, 13,2, 11,8 y 7,2 puntos, coeficiente de estudios 0,020 por nivel). En España 2016-2022 hay el sesgo de participación pero no se detecta la respuesta desigual (baja potencia): el eslabón sigue sin evidencia española"},{"id":"R277","de":"P06","a":"E51","nivel":"DEBIL","signo":"−","signoCorto":"−","etDe":"Brecha de participación por renta del barrio","etA":"Gasto público en sanidad","mecanismo":"Cuando votan o cuentan más los de menos estudios, el gobierno sube el gasto que más usan (la sanidad pública)","retardo":"de uno a cuatro años","tipo":"causal (regresión discontinua y calendario de implantación)","ambito":"Otro país: Brasil (1994-2002)","fuente":"Fujiwara (2015), Econometrica 83(2): 423-464, secc. 1 y 4","lectura":"secciones","contra":"Cantoni, Pons y Schafer (2024): no hay estudios identificados de cambios pequeños de participación, Hoffman et al. (2016): Austria ≈0","ref":"R277 en la ficha de relaciones. Nota: +3,4 puntos del presupuesto estatal en sanidad (+34 % en 8 años). DÉBIL solo por lectura parcial: leída entera sería APOYO"},{"id":"R119","de":"P31","a":"P01","nivel":"FIRME","signo":"+","signoCorto":"+","etD 1) Frontiers in Political Science 3:623709 tablas 4 y 6 (pp. 5-6) como mecanismo, Singer (2015) apéndice en línea (Dataverse 10.7910/DVN/AHKHTA) p. 2 sobre la exogeneidad","lectura":"texto completo","contra":"Lago y Martínez i Coma (2024) tabla 1 modelo 5: en los distritos de cinco escaños o menos la log magnitud no es significativa (0,043, e. t. 0,157) y un escaño más solo sube el NEP si el número resultante es par. Lago (2021) tabla 4: la log magnitud no explica el cambio del voto a Vox entre abril y noviembre de 2019 (0,23, e. t. 0,70), lo explica la viabilidad. Montero y Fernández Esquer (2018) p. 15: el sistema no frena la fragmentación de los partidos autonómicos con voto concentrado. Carey y Hix tabla 3 modelo 11: con efectos fijos el término lineal es ≈0 y el efecto está en las magnitudes bajas","ref":"R522 en la ficha de relaciones. Nota: España por distrito: (log) magnitud → NEP electoral +0,622 (e. t. 0,267) p < 0,05, es decir +0,43 partidos a corto plazo y +0,55 a largo al duplicar los escaños (cálculo propio). Distritos de 1-5 escaños: NEP parlamentario 0,71 del electoral frente a 0,85 en los de 10 o más (cálculo propio con la tabla 6 de Montero y Fernández Esquer). Comparado con efectos fijos de país: 1/(magnitud mediana) −0,99 (0,40) y barrera legal −0,32 (0,09) en el NEP parlamentario. Singer (2015, apéndice p. 2): en España el NEP previo no predice los cambios de magnitud (n = 416), y Singer y Gershman (2018, apéndice tablas A3, A5 y A7, 20 países con España 1977-2008) dan elasticidades de 0,07-0,10, que no cuentan como evidencia porque solo se han leído los apéndices. La barrera del 3 % solo pesa en Madrid y Barcelona (Lago 2021, p. 3), así que en P30 la barrera efectiva es la magnitud. Signo confirmado: −. Queda en APOYO y no en FIRME porque los paneles cuentan como correlacionales, aunque la variación de la magnitud por el reparto según la población es casi exógena. Singer (2015) PENDIENTE (cerrado)"},{"id":"R498","de":"P23","a":"P38","nivel":"APOYO","signo":"+","signoCorto":"+","etDe":"Fragmentación","etA":"Inestabilidad del gobierno","mecanismo":"Con más partidos hay más coaliciones posibles y cuesta más formar y sostener un gobierno","retardo":"menos de un año","tipo":"correlacional (binomial negativa con efectos fijos de país, 336-384 formaciones) y descriptiva (recuento en congreso.es)","ambito":"Europa occidental (17 países con España, 1945-2019) y ES (XI y XII legislaturas)","fuente":"Bäck, Hellström, Lindvall y Teorell, West European Politics 47(1):88-112, doi 10.1080/01402382.2023.2200328, tabla 2 (p. 98) y p. 99, Parra Gómez (ponencia AECPA, datos al 5/03/2019) pp. 3, 6 y 8, Simón (2020) SESP 25(3-4) p. 13 del postprint","lectura":"texto completo","contra":"Montilla Martos (2022) ReDCE 38: fragmentación no implica inestabilidad si la investidura crea una mayoría (la XIV aprobó tres PGE). Benítez, Pamies y Coller (borrador AECPA) tabla 2: el NEP no baja el consenso de las leyes autonómicas aprobadas. Bäck et al.: el modelo no explica las formaciones más largas, que dependen de partidos parias y compromisos preelectorales","ref":"R498 en la ficha de relaciones. Nota: Comparado: +0,078 a +0,101 en el logaritmo de días por unidad, casi un mes más en los sistemas más fragmentados. España: 315 días en funciones en 2015-2016 y repetición electoral, proyectos de ley aprobados 98,15 % (X) frente a 31,42 % (XII), normas aprobadas 84 (2015), 10 (2016), 34 (2017), 43 (2018), PGE de 2019 rechazados"},{"id":"R499","de":"P38","a":"P01","nivel":"APOYO","signo":"−","signoCorto":"−","etDe":"Inestabilidad del gobierno","etA":"Participación electoral total","mecanismo":"Repetir o acumular elecciones cansa y la movilización de los partidos rinde menos","retardo":"menos de un año","tipo":"correlacional (efectos fijos de país con PCSE, 22 democracias europeas 1939-2019, con dos experimentos naturales fuera de España) y descriptiva","ambito":"UE (22 democracias europeas con España) y ES (repeticiones de 2016 y noviembre . con muy poca variación del NEP. Miller y Listhaug (1990): partidos nuevos que canalizan el descontento recuperan la confianza (Noruega)","ref":"R497 en la ficha de relaciones. Nota: NEP longitudinal −0,96 (e. t. 0,45) y transversal −4,06 (1,06) puntos de % de satisfechos por DE (media 50,1 %). Sin curvatura. El efecto dentro del país es la cuarta parte del de entre países. Los autores lo llaman «controversial» y no prueban el mecanismo. Tabla 1 comprobada contra el PDF el 12/11/2026"},{"id":"R122","de":"P33","a":"P01","nivel":"APOYO","signo":"+","signoCorto":"+","etDe":"Facilidades del voto por correo","etA":"Participación electoral total","mecanismo":"El voto por correo universal abarata votar","retardo":"menos de un año","tipo":"causal (diferencias en diferencias)","ambito":"Otro país: EE. UU.","fuente":"Thompson, Wu, Yoder y Hall (2020), PNAS 117(25)","lectura":"texto completo","contra":"Hodler et al. (2015), Suiza: pendiente","ref":"R122 en la ficha de relaciones. Nota: +2,1 a +2,2 puntos, sin efecto partidista","curva":0.1},{"id":"R021","de":"E32","a":"E26","nivel":"FIRME","signo":"−","signoCorto":"−","etDe":"Salario mínimo interprofesional (SMI)","etA":"Pobreza laboral","mecanismo":"Sube el ingreso de los ocupados de salario bajo, que se concentran en hogares de renta baja","retardo":"menos de un año","tipo":"causal (diferencias en diferencias con emparejamiento, ECV 2016-2019)","ambito":"ES (2016-2019)","fuente":"Arranz y García-Serrano (2025), Social Science Research 127, 103143, secc. 6-7 · Comisión Asesora para el Análisis del SMI (2022) II Informe pp. 25-30 (gráficos 7-8 y resumen de Arranz y García-Serrano 2022 y Granell et al. 2022)","lectura":"texto completo","contra":"ISEAK (2021) p. 21: no hay datos para medirlo con diseño causal. Dube (2018) EE. UU.: un tercio de la ganancia se pierde en transferencias","ref":"R021 en la ficha de relaciones. Nota: Hogares con al menos un perceptor del SMI frente a los demás: probabilidad de no estar en pobreza mon rceló et al. (2021) BdE DO 2113 pp. 26-32, AIReF (2025) DT 9/25 pp. 22-24, De la Rica et al. (2021) ISEAK Informe 2021/6 pp. 47-51 (Gorjón et al. 2024 SERIEs 15), Casanova et al. (2025) Fedea EEE 2025/10 pp. 19-34","lectura":"texto completo","contra":"Dustmann et al. (2020) Alemania 2015: sin pérdida de empleo (UE). Cengiz et al. (2019) EE. UU.: empleo de los afectados +2,8 % n.s. Barceló et al. recuadro 1: con control por convenio la elasticidad es −0,18 frente a −0,7. Cárdenas et al. (2022) y CCOO (2019): sin efecto, no leídos","ref":"R020 en la ficha de relaciones. Nota: Total 2019: −0,13 a −0,45 pp de afiliación (AIReF 2020 y 2025), cota superior −0,6 a −1,1 (BdE, Fedea −0,5 a −1,0). 2023: −0,34 a −0,53 pp (55.000-85.000). Afectados: +1,7-1,9 pp de paso al paro a 12 meses, OWE −0,39 (Fedea). Crece con la incidencia del SMI (2023 > 2019) y se concentra en ≤5 empleados, sur y Canarias, mayores de 30-45 años"}],"pasos":[{"titulo":"Una sola pregunta","texto":"<p>¿Qué hace que más gente participe en las decisiones democráticas, y qué votos y políticas consiguen que más\n        personas vivan con dignidad, con sus derechos respetados y con menos rabia?<\/p>\n        <p>Se empieza por lo más visible: cuánta gente vota. En las generales de 2023 votó el 66,59 % del censo; contando\n        solo a los residentes en España, cerca del 70 %.<\/p>\n        <div class=\"dato\">Cómo se lee: cada caja es algo que se puede medir. Las de esquinas redondeadas cambian de una\n        vez para otra; las rectangulares, que irán apareciendo, son <b>depósitos<\/b>: se acumulan y tardan en moverse,\n        como la confianza o la soledad.<\/div>","nodos":["P01"],"enlaces":[],"resaltar":[],"todo":false},{"titulo":"Quién no vota","texto":"<p>La abstención no se reparte igual. En 2023, en los barrios de menos renta de 46 grandes ciudades se abstuvo\n        el 40,7 %; en los de más renta, el 20,1 %. Son unos 21 puntos de diferencia; en 2004 eran unos 15.<\/p>\n        <p>Las dos flechas dicen por qué se mueve esa brecha: cuando la participación baja, se retiran sobre todo los barrios\n        pobres; y en los países más desiguales la diferencia es mayor.<\/p>\n        <div class=\"dato\">Cómo se lee: <b>+<\/b> quiere decir que las dos cosas se mueven en el mismo sentido; <b>−<\/b>, en\n        sentido contrario. El grosor y el trazo de la flecha dicen cuánta evidencia la sostiene (leyenda, debajo del\n        diagrama). Pulsa una flecha para ver su fuente.<\/div>","nodos":["P06","E22"],"enlaces":["R115","R164"],"resaltar":[],"todo":false},{"titulo":"La confianza y el voto se alimentan","texto":"<p>En la primavera de 2026 solo el 14 % de los españoles confiaba en los partidos y el 26 % en el Parlamento,\n        menos que la media europea. En 2013 llegó a ser del 5 % y el 7 %.<\/p>\n        <p>Siguiendo a las mismas personas durante diez años (panel POLAT), quien gana un punto de confianza reduce algo su\n        intención de no votar, y quien se abstiene confía un poco menos después. Las dos flechas cierran un <b>bucle de\n        refuerzo<\/b>: cada vuelta empuja en el mismo sentido.<\/p>\n        <div class=\"aviso\">Que un bucle exista no quiere decir que pese. Medido con datos, este se refuerza muy poco: lo\n        que da una vuelta vuelve multiplicado por 0,01. No hay aquí una espiral de desconfianza.<\/div>","nodos":["L48"],"enlaces":["R271","R296"],"resaltar":[],"todo":false},{"titulo":"La corrupción: lo mejor medido","texto":"<p>Las dos flechas más firmes de esta parte del mapa son españolas y tienen diseño causal: comparan municipios con\n        escándalo y sin él, y lo demás igual.<\/p>\n        <p>Tras un escándalo local, en torno al 7 % de los vecinos pasa de confiar mucho a confiar poco. Y la participación\n        baja: un 1,5 % de media, y un 6,3 % entre quienes no tienen partido fijo cuando los escándalos se repiten.<\/p>\n        <div class=\"dato\">Las flechas gruesas y oscuras son <b>firmes<\/b>: un estudio que aísla la causa, leído, con datos\n        de España o de la Unión Europea. Las azules tienen apoyo, pero vienen de otros países o miden una asociación.<\/div>","nodos":["L27"],"enlaces":["R249","R250"],"resaltar":[],"todo":false},{"titulo":"La soledad aparta del voto","texto":"<p>En 2015, el 68,3 % de los españoles quedaba con amigos al menos una vez por semana; en 2022, el 50,7 %. Una de\n        cada cinco personas adultas dice sentir soledad no deseada.<\/p>\n        <p>Quien vive aislado vota menos: nadie le moviliza ni le acompaña. Quien se siente solo de forma crónica, también.\n        Y abstenerse aísla un poco más al año siguiente: otro bucle de refuerzo, algo más fuerte que el de la confianza\n        (0,07 por vuelta), pero pequeño.<\/p>\n        <div class=\"aviso\">Todo esto son asociaciones, no causas probadas: ningún estudio español ha aislado el efecto de la\n        soledad sobre el voto.<\/div>","nodos":["S47","S25"],"enlaces":["R325","R328","R327","R107"],"resaltar":[],"todo":false},{"titulo":"Desigualdad, agravio y protesta","texto":"<p>La desigualdad no lleva directamente a la rabia: dentro de España, su efecto sobre la ira medida en las\n        encuestas es casi nulo. Lo que sí mueve es la desconfianza en las instituciones y, a largo plazo, la sensación de que\n        a uno le miran por encima del hombro (las dos rayas sobre la flecha indican que tarda más de cuatro años).<\/p>\n        <p>El agravio lleva a protestar, y en España la protesta no sustituye al voto: quienes participaron en el 15M\n        aumentaron después su intención de votar.<\/p>\n        <div class=\"dato\">La protesta se trata como una <b>señal<\/b>, no como un resultado bueno o malo: es la forma de\n        decir «basta ya, así no podemos seguir». El modelo la informa, pero no la suma ni la resta.<\/div>","nodos":["S16","S22"],"enlaces":["R346","R354","R087","R293"],"resaltar":[],"todo":false},{"titulo":"¿Importa quién no vota?","texto":"<p>Es la pregunta de fondo. Si los barrios pobres votan menos, ¿las políticas les atienden menos? Fuera de España\n        se ha visto, pero solo cuando la participación es muy baja (menos del 40-50 %). En Brasil, cuando el voto electrónico\n        facilitó votar a los de menos estudios, subió el gasto en la sanidad pública que más usan.<\/p>\n        <p>En España no está medido. Al repetir con encuestas del CIS de 2016 a 2022 el estudio que lo midió hasta 2016, no\n        aparece una respuesta desigual a favor de los grupos altos, pero el análisis solo detectaría un efecto así en uno de\n        cada cinco casos.<\/p>\n        <p>Y si votara todo el mundo: con las respuestas de la encuesta postelectoral de 2023, el bloque que invistió al\n        Gobierno cambiaría entre 1,3 puntos menos y 1,3 más según la variante. No cambia el resultado de forma clara.<\/p>\n        <div class=\"aviso\">El signo «+?» marca una relación <b>condicional<\/b>: solo vale en ciertas condiciones, que la ficha\n        explica. Este es el eslabón más importante que el mapa deja abierto.<\/div>","nodos":["P39","E51"],"enlaces":["R152","R277"],"resaltar":[],"todo":false},{"titulo":"Las reglas del juego","texto":"<p>Algunas cajas no se miden: se <b>deciden<\/b>. Son las palancas, marcadas con un triángulo. Dos son reglas\n        electorales: cómo son las listas y con qué fórmula y tamaño de circunscripción se reparten los escaños.<\/p>\n        <p>Abrir las listas sube algo la participación (en municipios españoles, un punto). Bajar la barrera para conseguir\n        escaño también, porque menos gente siente que su voto se pierde. Pero trae más partidos, y con más partidos cuesta\n        más formar y sostener un gobierno, lo que cansa al votante.<\/p>\n        <p>Con los pesos medidos en los estudios, el beneficio gana: la medida sale a favor en 499 de cada 500 versiones del\n        modelo compatibles con los datos, y la participación sube en prácticamente todas.<\/p>\n        <div class=\"aviso\">Lo que no se puede afirmar: qué pasa con la satisfacción con la democracia (baja en el 77 % de las\n        versiones) y con el paro. Y aparece un riesgo probable: más voto a partidos con conductas antipluralistas.<\/div>","nodos":["P31","P30","P23","P38","L49"],"enlaces":["R119","R118","R522","R498","R499","R497"],"resaltar":[],"todo":false},{"titulo":"Facilitar el voto","texto":"<p>De quienes dicen no haber votado en 2023, el 22,6 % no pudo, sobre todo por problemas con el voto por correo.\n        Donde se ha universalizado, como en algunos estados de Estados Unidos, la participación sube unos dos puntos, sin\n        favorecer a ningún partido.<\/p>\n        <p>Es una de las medidas más sólidas del modelo: de las doce cosas que el cálculo afirma sobre ella, once se sostienen\n        frente a los datos.<\/p>\n        <div class=\"aviso\">Su riesgo conocido es que baje la confianza en la limpieza del recuento. Para que cambiara la\n        conclusión, ese riesgo tendría que pesar unas dieciocho veces lo que pesa una relación corriente del mapa medida con datos.<\/div>","nodos":["P33"],"enlaces":["R122"],"resaltar":[],"todo":false},{"titulo":"Las políticas: el salario mínimo","texto":"<p>La segunda mitad de la pregunta es qué políticas mejoran la vida de la gente. El modelo compara veintitrés\n        escenarios con las mismas reglas: cuántos de los resultados que importan a las personas mejoran y cuántos empeoran.<\/p>\n        <p>Subir el salario mínimo tiene la mejor evidencia española: en los hogares con alguien que lo cobra, la renta sube\n        entre un 6 y un 8 % y baja la pobreza. También tiene coste: en los puestos de salario más bajo se contrata menos.\n        Las dos caras están medidas y entran en la cuenta.<\/p>\n        <div class=\"dato\">Es el escenario con mejor saldo del motor: 15 resultados\n        mejoran y 4 empeoran (el empleo entre ellos).<\/div>","nodos":["E32","E26","E24","E60"],"enlaces":["R021","R404","R020"],"resaltar":[],"todo":false},{"titulo":"El mapa entero, y lo que no sabe","texto":"<p>Lo que has visto es una parte. El modelo completo tiene 215 variables y 339\n        relaciones, cada una con su fuente. Lo que solo es plausible se aparta y no se usa en el cálculo.<\/p>\n        <p><b>Dice hacia dónde, no cuánto.<\/b> El mapa indica si algo empuja a mejor o a peor. Como casi ningún peso está\n        medido, se prueban miles de combinaciones de pesos y solo se quedan las que reproducen lo que dicen los datos: con\n        toda la evidencia, unas 4.750 de 150.000. Una conclusión solo se afirma si se cumple en al menos el 85 % de ellas.<\/p>\n        <p><b>Lo que falta<\/b> y decidiría la discusión: si en España las políticas atienden menos a quien vota menos; cómo\n        afecta la desinformación a la participación (no hay ningún estudio español); y cuánto pesa la riqueza acumulada en\n        las reglas fiscales.<\/p>","nodos":[],"enlaces":[],"resaltar":[],"todo":true}]};

      for (const d of [-4, 4]) { const hz = Math.abs(p2.y - p1.y) < Math.abs(p2.x - p1.x);
        el('path', { d: hz ? `M${p1.x},${p1.y + d} L${p2.x},${p2.y + d}` : `M${p1.x + d},${p1.y} L${p2.x + d},${p2.y}`, stroke: '#52606D', 'stroke-width': 2, fill: 'none' }, g); }
      el('path', { d: `M${f.vx - 11},${f.vy - 9} L${f.vx + 11},${f.vy + 9} L${f.vx + 11},${f.vy - 9} L${f.vx - 11},${f.vy + 9} Z`, fill: '#fff', stroke: '#12355B', 'stroke-width': 2 }, g);
      const t = el('text', { x: f.vx + (f.tx || 0), y: f.vy + (f.ty || 26), 'text-anchor': 'middle', 'font-size': 13, fill: '#1F2933', 'font-style': 'italic' }, g); t.textContent = f.et; }
    // Enlaces causales
    for (const id of E) { const e = enlace[id]; if (!e) continue; const A = punto(e.de), B = punto(e.a); if (!A || !B) continue;
      const k = nivelDe(e.nivel), v = NIV[k], curva = e.curva == null ? 0.18 : e.curva;
      const p1 = A.n ? borde(A.n, B) : A, p2 = B.n ? borde(B.n, A) : { x: B.x + (A.x - B.x) * 14 / Math.hypot(A.x - B.x, A.y - B.y), y: B.y + (A.y - B.y) * 14 / Math.hypot(A.x - B.x, A.y - B.y) };
      const mx = (p1.x + p2.x) / 2 - (p2.y - p1.y) * curva, my = (p1.y + p2.y) / 2 + (p2.x - p1.x) * curva;
      const g = el('g', { class: 'enlace', opacity: op(id), tabindex: 0, role: 'button', 'aria-label': `${e.etDe} → ${e.etA}` });
      el('path', { d: `M${p1.x},${p1.y} Q${mx},${my} ${p2.x},${p2.y}`, stroke: 'transparent', 'stroke-width': 16, fill: 'none' }, g);
      el('path', { d: `M${p1.x},${p1.y} Q${mx},${my} ${p2.x},${p2.y}`, stroke: v.c, 'stroke-width': sel === id ? v.w + 2 : v.w, 'stroke-dasharray': v.dash, fill: 'none', 'marker-end': `url(#p-${k})` }, g);
      const t = 0.55, bx = (1 - t) ** 2 * p1.x + 2 * (1 - t) * t * mx + t * t * p2.x, by = (1 - t) ** 2 * p1.y + 2 * (1 - t) * t * my + t * t * p2.y;
      const sg = e.signoCorto;
      el('circle', { cx: bx, cy: by, r: sg.length > 1 ? 15 : 10, fill: '#fff', stroke: v.c, 'stroke-width': 1.5 }, g);
      const st = el('text', { x: bx, y: by + 5, 'text-anchor': 'middle', 'font-size': sg.length > 1 ? 11 : 15, 'font-weight': 700, fill: '#1F2933' }, g); st.textContent = sg;
      if (e.retardoLargo) { const ang = Math.atan2(p2.y - mx, p2.x - mx), t2 = 0.78, cx = (1 - t2) ** 2 * p1.x + 2 * (1 - t2) * t2 * mx + t2 * t2 * p2.x, cy = (1 - t2) ** 2 * p1.y + 2 * (1 - t2) * t2 * my + t2 * t2 * p2.y, nx = Math.cos(ang + Math.PI / 2) * 7, ny = Math.sin(ang + Math.PI / 2) * 7, ox = Math.cos(ang) * 3, oy = Math.sin(ang) * 3;
        for (const s of [-1, 1]) el('line', { x1: cx - nx + ox * s, y1: cy - ny + oy * s, x2: cx + nx + ox * s, y2: cy + ny + oy * s, stroke: v.c, 'stroke-width': 2 }, g); }
      g.addEventListener('click', () => verFicha(id)); g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); verFicha(id); } });
      const tt = el('title', {}, g); tt.textContent = `${e.etDe} → ${e.etA} (${v.et}). Pulsa para ver la fuente.`; }
    // Nodos
    for (const id of N) { const n = nodo[id], { w, h } = caja(n), g = el('g', { class: 'nodo', opacity: op(id) });
      if (n.tipo === 'deposito') el('rect', { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, fill: '#fff', stroke: '#12355B', 'stroke-width': 2.2 }, g);
      else if (n.tipo === 'decision') { el('rect', { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 6, fill: '#F5F9FC', stroke: '#12355B', 'stroke-width': 1.4 }, g); el('path', { d: `M${n.x - w / 2 + 6},${n.y - h / 2 + 15} L${n.x - w / 2 + 13},${n.y - h / 2 + 5} L${n.x - w / 2 + 20},${n.y - h / 2 + 15} Z`, fill: '#12355B' }, g); }
      else el('rect', { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: h / 2, fill: n.tipo === 'resultado' ? '#F0F4F8' : '#fff', stroke: '#9AA5B1', 'stroke-width': 1.2 }, g);
      const lin = n.et.split('\n'), dato = n.dato ? 1 : 0, total = lin.length + dato, y0 = n.y - (total - 1) * 8 + 5;
      lin.forEach((s, i) => { const t = el('text', { x: n.x, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': n.tipo === 'deposito' ? 700 : 600, fill: '#1F2933' }, g); t.textContent = s; });
      if (dato) { const t = el('text', { x: n.x, y: y0 + lin.length * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: '#1F5A8A', 'font-weight': 700 }, g); t.textContent = n.dato; }
      if (n.def) { const tt = el('title', {}, g); tt.textContent = n.def; } }
    // Panel
    document.getElementById('pason').textContent = `Paso ${pasoAct + 1} de ${DATOS.pasos.length}`;
    document.getElementById('pasot').textContent = p.titulo;
    document.getElementById('texto').innerHTML = p.texto;
    const lista = (p.enlaces || []).filter(id => enlace[id]);
    document.getElementById('nuevas').innerHTML = lista.length ? '<h3>Las flechas de este paso</h3>' + lista.map(id => { const e = enlace[id], k = nivelDe(e.nivel);
      return `<button class="rel${sel === id ? ' act' : ''}" data-id="${id}" type="button"><span class="chip n-${k}">${NIV[k].et}</span><span>${esc(e.etDe)} <b>${esc(e.signoCorto)}</b> → ${esc(e.etA)}</span></button>`; }).join('') : '';
    document.querySelectorAll('#nuevas .rel').forEach(b => b.addEventListener('click', () => verFicha(b.dataset.id)));
    const pts = document.getElementById('puntos'); pts.innerHTML = DATOS.pasos.map((_, i) => `<span class="${i === pasoAct ? 'act' : i < pasoAct ? 'hecho' : ''}" data-i="${i}" title="Paso ${i + 1}"></span>`).join('');
    pts.querySelectorAll('span').forEach(s => s.addEventListener('click', () => ir(+s.dataset.i)));
    document.getElementById('ant').disabled = pasoAct === 0; document.getElementById('sig').disabled = pasoAct === DATOS.pasos.length - 1;
  }
  function verFicha(id) {
    const e = enlace[id], k = nivelDe(e.nivel), f = document.getElementById('ficha');
    sel = id; pintar();
    f.innerHTML = `<b class="t">${esc(e.etDe)} ${esc(e.signoCorto)} → ${esc(e.etA)}</b><span class="chip n-${k}">${NIV[k].et}</span> <span style="color:#52606D">${esc(NIV[k].d)}</span>` +
      `<dl>${e.mecanismo ? `<dt>Mecanismo</dt><dd>${esc(e.mecanismo)}</dd>` : ''}<dt>Signo</dt><dd>${esc(e.signo)}</dd>${e.retardo ? `<dt>Tarda</dt><dd>${esc(e.retardo)}</dd>` : ''}` +
      `<dt>Evidencia</dt><dd>${esc(e.tipo || '—')}${e.ambito ? ' · ' + esc(e.ambito) : ''}</dd><dt>Fuente</dt><dd>${esc(e.fuente || 'Ninguna')}</dd>${e.lectura ? `<dt>Leído</dt><dd>${esc(e.lectura)}</dd>` : ''}${e.contra ? `<dt>En contra</dt><dd>${esc(e.contra)}</dd>` : ''}${e.ref ? `<dt>Ficha</dt><dd>${esc(e.ref)}</dd>` : ''}</dl>`;
    f.classList.add('ver');
    if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) f.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  // En pantallas estrechas el mapa se desplaza de lado: se centra en lo que aparece en cada paso
  function centrar() {
    const sc = document.getElementById('lienzo-scroll'), p = DATOS.pasos[pasoAct];
    if (!sc || sc.scrollWidth <= sc.clientWidth + 4) return;
    const xs = [];
    for (const id of [...(p.nodos || []), ...(p.resaltar || [])]) if (nodo[id]) xs.push(nodo[id].x);
    for (const id of p.enlaces || []) { const e = enlace[id]; if (e && nodo[e.de] && nodo[e.a]) xs.push((nodo[e.de].x + nodo[e.a].x) / 2); }
    const cx = xs.length && !p.todo ? xs.reduce((a, b) => a + b, 0) / xs.length : DATOS.ancho / 2;
    sc.scrollLeft = cx * sc.scrollWidth / DATOS.ancho - sc.clientWidth / 2;
  }
  function ir(i) { pasoAct = Math.max(0, Math.min(DATOS.pasos.length - 1, i)); sel = null; document.getElementById('ficha').classList.remove('ver'); pintar(); centrar(); try { history.replaceState(null, '', '#paso' + (pasoAct + 1)); } catch (e) { } }
  document.getElementById('ant').addEventListener('click', () => ir(pasoAct - 1));
  document.getElementById('sig').addEventListener('click', () => ir(pasoAct + 1));
  document.addEventListener('keydown', ev => { if (ev.target.closest && ev.target.closest('button,[role=button]') && (ev.key === 'Enter' || ev.key === ' ')) return; if (ev.key === 'ArrowRight') ir(pasoAct + 1); if (ev.key === 'ArrowLeft') ir(pasoAct - 1); });
  const m = /#paso(\d+)/.exec(location.hash); ir(m ? +m[1] - 1 : 0);
})();
</script>
