<!DOCTYPE html>

<title>SOIH - Esquema del sistema</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Calibri, "Segoe UI", Arial, sans-serif; color:#1F2933; background:#F7F9FB; }
  header { padding:10px 18px; background:#12355B; color:#fff; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header p { margin:3px 0 0; font-size:13.5px; color:#D9E2EC; max-width:1300px; }
  #cuerpo { display:flex; align-items:flex-start; }
  #lienzo { flex:1; min-width:0; background:#fff; display:block; }
  #lado { width:370px; padding:12px 14px; border-left:1px solid #CBD2D9; background:#fff; font-size:14px; max-height:calc(100vh - 60px); overflow:auto; }
  #lado h2 { font-size:15px; margin:0 0 6px; color:#12355B; }
  .carta { border:1px solid #CBD2D9; border-radius:6px; padding:8px 10px; margin-bottom:8px; cursor:pointer; }
  .carta:hover { background:#F0F4F8; }
  .carta.activa { border-color:#12355B; background:#EAF2F8; }
  .carta b { color:#12355B; }
  .carta .clase { font-size:12px; color:#52606D; text-transform:uppercase; letter-spacing:.04em; }
  .carta p { margin:5px 0 0; font-size:13px; }
  .eti { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; border:1px solid #CBD2D9; color:#52606D; margin-right:4px; }
  .bucle { font-size:12.5px; margin-top:5px; padding-left:8px; border-left:4px solid #999; }
  text { font-family: Calibri, "Segoe UI", Arial, sans-serif; }
  .nom { font-size:13px; fill:#1F2933; }
  .apagado { opacity:.10; }
  body.estatico #lado { display:none; }
  @media (max-width: 900px) { #cuerpo { flex-direction:column; } #lado { width:auto; max-height:none; border-left:0; border-top:1px solid #CBD2D9; } }
</style>
</head>

80,"up":0,"sint":0,"dec":0,"du":"Gobierno de España (interpone) · Tribunal Constitucional (mantiene o levanta)"}],"aristas":[{"id":"R115","de":"P01","a":"P06","p":"-","c":2,"h":0,"q":0,"r":"meses","m":"Cuando baja la participación se retiran sobre todo los barrios pobres (ley de Tingsten)","P":"P0","D":"D2","conf":"Media"},{"id":"R128","de":"P17","a":"P01","p":"+","c":1,"h":0,"q":1,"r":"meses","m":"Sube lo que está en juego: dejar fuera al «enemigo»","P":"P0","D":"D2","conf":"Baja"},{"id":"R164","de":"E22","a":"P06","p":"+","c":2,"h":0,"q":0,"r":"","m":"Los ricos fijan la agenda y los pobres se retiran","P":"P0","D":"D2","conf":"Media"},{"id":"R170","de":"S54","a":"P17","p":"+","c":2,"h":0,"q":0,"r":"meses","m":"El rechazo cultural a la inmigración sube la polarización afectiva","P":"P0","D":"D2","conf":"Media"},{"id":"R278","de":"P06","a":"E50","p":"-","c":1,"h":0,"q":0,"r":"1-3 años","m":"Si vota más la clase trabajadora o un grupo excluido, sube el gasto o las transferencias que le llegan","P":"P0","D":"D1","conf":"Baja"},{"id":"R340","de":"E50","a":"E22","p":"-","c":1,"h":0,"q":0,"r":"meses","m":"Las prestaciones monetarias (pensiones, desempleo, invalidez, asistencia social, familia, vivienda) reducen la desigualdad","P":"P0","D":"D1","conf":"Baja"},{"id":"R349","de":"E22","a":"S14","p":"-","c":2,"h":0,"q":0,"r":"1-3 años","m":"Con más desigualdad la gente se sitúa más abajo en la escalera social, sobre todo los hombres sin estudios superiores","P":"P0","D":"D2","conf":"Media"},{"id":"R356","de":"E22","a":"P46","p":"+","c":2,"h":0,"q":0,"r":">3 años","m":"La desigualdad amenaza el estatus de quien teme caer y la derecha radical ofrece un estatus nativista","P":"P0","D":"D2","conf":"Media"},{"id":"R374","de":"P71","a":"E50","p":"+","c":2,"h":0,"q":0,"r":"1-3 años","m":"Con un electorado obrero, la derecha radical en el gobierno frena los recortes de pensiones y prestaciones de sus socios, aunque acepta privatizar y desregular","P":"P0","D":"D2","conf":"Media"},{"id":"R375","de":"P59","a":"P46","p":"+","c":3,"h":0,"q":0,"r":"1-3 años","m":"Con la izquierda gobernando, parte del electorado se desplaza a la derecha y la extrema derecha crece más que con la derecha en el gobierno","P":"P0","D":"D3","conf":"Alta"},{"id":"R376","de":"P46","a":"P59","p":"-","c":1,"h":0,"q":0,"r":"meses","m":"Los escaños de la derecha radical permiten gobiernos de derecha que sin ellos no tendrían mayoría","P":"P0","D":"D1","conf":"Baja"},{"id":"R381","de":"P71","a":"P46","p":"-","c":1,"h":0,"q":0,"r":"1-3 años","m":"Gobernar obliga a la derecha radical a votar recortes o a incumplir, y pierde votos","P":"P0","D":"D1","conf":"Baja"},{"id":"R383","de":"P66","a":"L54","p":"+","c":1,"h":0,"q":0,"r":"meses","m":"El Gobierno central recurre las normas autonómicas que considera inconstitucionales e invoca la suspensión","P":"P0","D":"D1","conf":"Baja"},{"id":"R384","de":"L54","a":"P66","p":"-","c":1,"h":0,"q":0,"r":"meses","m":"La suspensión deja sin aplicar la norma mientras el Tribunal resuelve","P":"P0","D":"D1","conf":"Baja"},{"id":"R485","de":"P46","a":"P71","p":"+","c":1,"h":0,"q":0,"r":"meses","m":"Los escaños de la derecha radical permiten investir gobiernos que dependen de su apoyo o la incluyen","P":"P0","D":"D1","conf":"Baja"},{"id":"R488","de":"S14","a":"S54","p":"-","c":1,"h":0,"q":0,"r":"1-3 años","m":"Bajo estatus, más idea de que los inmigrantes socavan la cultura","P":"P0","D":"D1","conf":"Baja"}],"arquetipos":[{"id":"AQ2","clase":"Bucle de equilibrio","nombre":"El péndulo de la alternancia","explica":"Con la izquierda gobernando, la derecha radical crece más que con la derecha en el gobierno (discontinuidad en elecciones municipales ajustadas, España); sus escaños permiten gobiernos de derecha que sin ellos no tendrían mayoría, y con la derecha gobernando crece menos. El signo de la ideología del gobierno es una convención técnica (+ = más a la izquierda), sin valor normativo.","duda":"La vuelta (escaños de la derecha radical → gobiernos de derecha) es un caso descriptivo de Andalucía 2018-2019; los gobiernos autonómicos de 2022-2024 están sin verificar en boletín. Los autores del primer tramo advierten que puede deberse a la reacción de la derecha en la oposición y no a las políticas de la izquierda.","cumple":1,"c":1,"apoyo":"Con apoyo","dep":[],"bucles":[{"rol":"El péndulo","t":"B","c":1,"ret":2.5,"n":["P46","P59"],"a":["R376","R375"]}]},{"id":"AQ3","clase":"Bucle de equilibrio","nombre":"Gobernar desgasta","explica":"Cuando la derecha tradicional necesita sus escaños, firma pactos con la derecha radical; gobernar la obliga a votar recortes o a incumplir, y pierde votos.","duda":"Las dos relaciones son de confianza baja: casos (Austria, 2002) y la serie oficial de Vox entre noviembre de 2019 y 2023, que no se puede atribuir a gobernar sin un diseño que compare comunidades. Dos estudios que podrían subirla están pendientes de lectura.","cumple":1,"c":1,"apoyo":"Con apoyo","dep":[],"bucles":[{"rol":"El desgaste","t":"B","c":1,"ret":2.5,"n":["P46","P71"],"a":["R485","R381"]}]},{"id":"AQ4","clase":"Bucle de equilibrio","nombre":"El freno constitucional","explica":"El Gobierno central recurre con suspensión las normas autonómicas aprobadas con la derecha radical que considera inconstitucionales, y la suspensión las deja sin aplicar mientras el Tribunal Constitucional resuelve. Es una herramienta del Gobierno central sea cual sea su partido.","duda":"Tres leyes localizadas y un efecto jurídico no medido en la práctica. El Auto 88/2025 levanta parte de la suspensión y advierte que no puede ser la regla.","cumple":1,"c":1,"apoyo":"Con apoyo","dep":[],"bucles":[{"rol":"El freno","t":"B","c":1,"ret":1,"n":["P66","L54"],"a":["R383","R384"]}]},{"id":"AQ5","clase":"Equilibrio con retardo","nombre":"De la desigualdad al voto, y vuelta","explica":"El primer foco del caso. Más desigualdad baja el estatus que la gente se atribuye; el bajo estatus va con más rechazo cultural a la inmigración; ese rechazo polariza; la polarización moviliza; con más participación se estrecha la brecha entre barrios pobres y ricos; si votan más los de abajo, les llegan más transferencias, y las prestaciones reducen la desigualdad. Es de equilibrio y lento: la desigualdad acaba activando lo que la corrige.","duda":"Tres eslabones son de confianza baja: estatus → rechazo a la inmigración (otros países), polarización → participación (disputada) y brecha → gasto social (Australia y EE. UU., R278); la vuelta a la desigualdad es la incidencia de las prestaciones existentes (R340, microsimulación). Desde el 26/10/2026 pasa por R278 y no por R042 (brecha → progresividad), que la duplicaba y se quitó. En España la desigualdad provincial objetiva no mueve el estatus (García-Sánchez et al., citado en la relación). Desde el reparto del 29/10/2026 el bucle pasa por el componente cultural del rechazo (S54) y no por el económico: el cálculo propio con POLAT mide +0,031 puntos de polarización por punto de rechazo cultural (IC95 0,015 a 0,047) y ≈0 por el económico. El bucle no cambia de forma, pero sí lo que recorre.","cumple":1,"c":1,"apoyo":"Con apoyo","dep":[],"bucles":[{"rol":"El bucle","t":"B","c":1,"ret":8,"n":["E22","S14","S54","P17","P01","P06","E50"],"a":["R349","R488","R170","R128","R115","R278","R340"]}]},{"id":"AQ6","clase":"Éxito para quien tiene éxito","nombre":"Quien vota, recibe","explica":"Con más desigualdad los pobres se retiran de las urnas y crece la brecha de participación; si vota menos la clase trabajadora, le llegan menos transferencias, y con menos prestaciones hay más desigualdad (refuerzo). En sentido contrario, la desigualdad aumenta a largo plazo el voto a la derecha radical, que en el gobierno frena los recortes de pensiones y prestaciones de sus socios (equilibrio).","duda":"Los dos tramos hacia el gasto vienen de fuera o miden otra cosa: brecha → gasto es de Australia y EE. UU. y no mide la brecha por barrio; derecha radical → gasto mide la generosidad con la derecha radical en el gobierno, no su voto. La vuelta (prestaciones → desigualdad) mide la incidencia de las prestaciones existentes, no el efecto de cambiarlas. La regla del motor para esta clase es parcial.","cumple":1,"c":1,"apoyo":"Con apoyo","dep":[],"bucles":[{"rol":"La rama que gana","t":"R","c":1,"ret":2.5,"n":["E22","P06","E50"],"a":["R164","R278","R340"]},{"rol":"El contrapeso","t":"B","c":1,"ret":8,"n":["E22","P46","P71","E50"],"a":["R356","R485","R374","R340"]}]}]};
(function () {
  const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('lienzo'), lado = document.getElementById('lado');
  const par = new URLSearchParams(location.search);
  if (par.get('e') === '1') document.body.classList.add('estatico');
  const CONF = ['Conjetura', 'Baja', 'Media', 'Alta'];

  const el = (t, at, p) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); (p || svg).appendChild(e); return e; };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  const defs = el('defs', {});
  [['mas', MAS], ['menos', MENOS]].forEach(([id, c]) => { const m = el('marker', { id: 'f-' + id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs); el('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }, m); });

    const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const x1 = p.x + ux * (RN + 2), y1 = p.y + uy * (RN + 2), x2 = q.x - ux * (RN + 5), y2 = q.y - uy * (RN + 5);
    const k = 0.16, mx = (x1 + x2) / 2 - dy * k, my = (y1 + y2) / 2 + dx * k;
    const c = a.p === '+' ? MAS : MENOS;

    a.halo = el('path', { d: a.d, fill: 'none', stroke: 'none', 'stroke-width': 11, 'stroke-linecap': 'round', 'stroke-opacity': .35 }, gHalo);
    el('path', { d: a.d, fill: 'none', stroke: c, 'stroke-width': 1.3 + a.c * 0.75, 'stroke-dasharray': a.c === 0 ? '2 5' : (a.q ? '9 4' : ''), 'marker-end': `url(#f-${a.p === '+' ? 'mas' : 'menos'})` }, a.g);
    // punto de la curva en t y su tangente
    const pt = t => [(1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * mx + t * t * x2, (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * my + t * t * y2];
    const [sx, sy] = pt(0.80);
    const nx = -(y2 - my), ny = (x2 - mx), nn = Math.hypot(nx, ny) || 1;
    el('circle', { cx: sx + nx / nn * 11, cy: sy + ny / nn * 11, r: 8, fill: '#fff', stroke: c, 'stroke-width': 1 }, a.g);
    const s = el('text', { x: sx + nx / nn * 11, y: sy + ny / nn * 11 + 4.5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: c }, a.g); s.textContent = a.p === '+' ? '+' : '−';
    if (a.r === '1-3 años' || a.r === '>3 años') {
      const [tx, ty] = pt(0.5), [t2x, t2y] = pt(0.52), vx = t2x - tx, vy = t2y - ty, vn = Math.hypot(vx, vy) || 1, px = -vy / vn, py = vx / vn;
      const n = a.r === '>3 años' ? [-3.5, 3.5] : [0];
      n.forEach(o => el('line', { x1: tx + vx / vn * o - px * 7, y1: ty + vy / vn * o - py * 7, x2: tx + vx / vn * o + px * 7, y2: ty + vy / vn * o + py * 7, stroke: '#1F2933', 'stroke-width': 2 }, a.g));
    }
    const tt = el('title', {}, a.g); tt.textContent = `${nodo[a.de].n} → (${a.p}) ${nodo[a.a].n}\n${a.m}\nRetardo: ${a.r} · Confianza: ${CONF[a.c]} (${a.P}/${a.D})${a.q ? ' · disputada' : ''}`;
  });

  // Variables: circulo; decision = rombo; sintoma = doble anillo
  const partir = s => { if (s.length <= 24) return [s]; const m = s.length / 2; let b = -1; for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (b < 0 || Math.abs(i - m) < Math.abs(b - m))) b = i; return b < 0 ? [s] : [s.slice(0, b), s.slice(b + 1)]; };
  DATOS.nodos.forEach(n => {

    else { if (n.sint) el('circle', { cx: n.x, cy: n.y, r: RN + 5, fill: 'none', stroke: col[n.c], 'stroke-width': 2 }, n.g); el('circle', { cx: n.x, cy: n.y, r: RN, fill: col[n.c], stroke: '#fff', 'stroke-width': 2 }, n.g); }
    const lin = partir(n.n), arriba = n.y < 130 || n.up;

      const bg = el('text', { x: n.x, y, 'text-anchor': 'middle', class: 'nom', stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round' }, n.g); bg.textContent = t;
      const tx = el('text', { x: n.x, y, 'text-anchor': 'middle', class: 'nom', 'font-weight': (n.sint || n.dec) ? 700 : 400 }, n.g); tx.textContent = t;
    });
    const tt = el('title', {}, n.g); tt.textContent = `${n.n}\n${n.d}${n.du ? '\nLa decide: ' + n.du : ''}`;
  });

  // Leyenda
  const gl = el('g', { transform: 'translate(1150,22)' });
  el('rect', { x: -12, y: -14, width: 292, height: 134, fill: '#fff', stroke: '#CBD2D9', rx: 6 }, gl);
  const ley = [['line', MAS, 'Azul (+): si el origen sube, el destino sube'], ['line', MENOS, 'Naranja (−): si el origen sube, el destino baja'], ['dash', '#52606D', 'A trazos: relación disputada'], ['dot', '#52606D', 'Punteada: conjetura o hipótesis sin fuente'], ['ret', '#1F2933', 'Trazos cruzados: efecto con retardo de años'], ['rombo', '#52606D', 'Rombo: variable que decide un actor'], ['anillo', '#52606D', 'Doble anillo: síntoma']];
  ley.forEach((l, i) => {

    else if (l[0] === 'anillo') { el('circle', { cx: 12.5, cy: y - 1, r: 6.5, fill: 'none', stroke: l[1], 'stroke-width': 1.5 }, gl); el('circle', { cx: 12.5, cy: y - 1, r: 3.5, fill: l[1] }, gl); }
    else if (l[0] === 'ret') { el('line', { x1: 0, y1: y - 1, x2: 26, y2: y - 1, stroke: '#829AB1', 'stroke-width': 2 }, gl); [10, 15].forEach(x => el('line', { x1: x, y1: y - 7, x2: x, y2: y + 5, stroke: l[1], 'stroke-width': 2 }, gl)); }
    else el('line', { x1: 0, y1: y - 1, x2: 26, y2: y - 1, stroke: l[1], 'stroke-width': 2.5, 'stroke-dasharray': l[0] === 'dash' ? '7 3' : l[0] === 'dot' ? '2 4' : '' }, gl);
    const t = el('text', { x: 34, y: y + 3, 'font-size': 12, fill: '#1F2933' }, gl); t.textContent = l[2];
  });

  // Seleccion de arquetipo
  let activo = null;
  function pintar() {
    gEt.innerHTML = '';
    const A = DATOS.arquetipos.find(a => a.id === activo);
    const ar = new Map(), no = new Set();
    if (A) A.bucles.forEach((b, i) => { b.a.forEach(id => { if (!ar.has(id)) ar.set(id, i); }); b.n.forEach(id => no.add(id)); });
    DATOS.aristas.forEach(a => { a.g.classList.toggle('apagado', !!A && !ar.has(a.id)); a.halo.setAttribute('stroke', A && ar.has(a.id) ? COLB[ar.get(a.id) % COLB.length] : 'none'); });
    DATOS.nodos.forEach(n => n.g.classList.toggle('apagado', !!A && !no.has(n.id)));
    if (A) A.bucles.forEach((b, i) => {
      // etiqueta del bucle en el centro de sus variables, desplazada para que no se solapen
      // etiquetas de los bucles apiladas en la esquina superior izquierda: no tapan el dibujo
      const g = el('g', {}, gEt), c = COLB[i % COLB.length];
      const txt = `${b.t}${i + 1} · ${b.rol} · ${b.t === 'R' ? 'refuerzo' : 'equilibrio'}` + (b.ret ? ` · ≈ ${String(b.ret).replace('.', ',')} años` : '');
      el('rect', { x: 20, y: 18 + i * 36, width: txt.length * 7.6 + 46, height: 28, rx: 14, fill: '#fff', stroke: c, 'stroke-width': 2.5 }, g);
      el('line', { x1: 32, y1: 32 + i * 36, x2: 52, y2: 32 + i * 36, stroke: c, 'stroke-width': 9, 'stroke-opacity': .45, 'stroke-linecap': 'round' }, g);
      const t = el('text', { x: 60, y: 37 + i * 36, 'font-size': 14.5, 'font-weight': 700, fill: c }, g); t.textContent = txt;
    });
    document.getElementById('titulo').textContent = A ? `${A.id} · ${A.nombre}  —  arquetipo «${A.clase}» · ${A.apoyo.toUpperCase()}` : DATOS.titulo + ' · Esquema del sistema: variables clave, conexiones críticas y arquetipos';
    document.getElementById('sub').textContent = A ? A.explica : `${DATOS.nodos.length} variables clave y ${DATOS.aristas.length} relaciones: las que forman los ${DATOS.arquetipos.length} arquetipos identificados. Pulsa un arquetipo para ver sus bucles.`;
    lado.querySelectorAll('.carta').forEach(c => c.classList.toggle('activa', c.dataset.id === activo));
  }
  lado.innerHTML = '<h2>Arquetipos</h2>' + DATOS.arquetipos.map(a => `<div class="carta" data-id="${a.id}"><div class="clase">${esc(a.clase)}</div><b>${a.id} · ${esc(a.nombre)}</b>
    <p>${esc(a.explica)}</p>` + a.bucles.map((b, i) => `<div class="bucle" style="border-color:${COLB[i % COLB.length]}"><b style="color:${COLB[i % COLB.length]}">${b.t}${i + 1}</b> ${esc(b.rol)} · ${b.t === 'R' ? 'refuerzo' : 'equilibrio'} · ${b.ret === 0 ? 'inmediato' : '≈ ' + String(b.ret).replace('.', ',') + ' años'}<br>${b.n.map(id => esc(nodo[id].n)).join(' → ')}</div>`).join('') +
    `<p><span class="eti" style="color:${a.apoyo === 'Con apoyo' ? '#276749' : '#C05621'};border-color:${a.apoyo === 'Con apoyo' ? '#276749' : '#C05621'}"><b>${a.apoyo}</b></span><span class="eti">${a.cumple ? 'Estructura verificada' : 'Estructura no verificada'}</span></p>${a.dep.length ? '<p><i>Depende de hipótesis sin fuente:</i> ' + a.dep.map(esc).join('; ') + '</p>' : ''}<p><i>En duda:</i> ${esc(a.duda)}</p></div>`).join('') +
    '<p style="font-size:12.5px;color:#52606D">Pulsa de nuevo el arquetipo activo para volver a la vista completa. Pasa el ratón por una variable o una flecha para ver su definición o su mecanismo.</p>';
  lado.querySelectorAll('.carta').forEach(c => c.addEventListener('click', () => { activo = activo === c.dataset.id ? null : c.dataset.id; pintar(); }));
  activo = par.get('a') || null;
  pintar();
})();
</script>
</body>
</html>
