<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOIH - Mapa causal N2</title>
<style>
  :root { --fondo:#F7F9FB; --tinta:#1F2933; --suave:#52606D; --linea:#CBD2D9; --panel:#FFFFFF; --mas:#2B6CB0; --menos:#C05621; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Calibri, "Segoe UI", Arial, sans-serif; color:var(--tinta); background:var(--fondo); }
  header { padding:10px 16px; background:#12355B; color:#fff; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .ctrl { font-size:13px; display:flex; gap:6px; align-items:center; }
  header select, header input[type=text] { font:inherit; padding:3px 6px; border-radius:4px; border:1px solid #9FB3C8; }
  #cuerpo { display:flex; height:calc(100vh - 52px); }
  #lienzo { flex:1; min-width:0; background:var(--panel); cursor:grab; }
  #lado { width:360px; border-left:1px solid var(--linea); padding:12px 14px; overflow:auto; background:var(--panel); font-size:14px; }
  #lado h2 { font-size:16px; margin:0 0 4px; color:#12355B; }
  #lado h3 { font-size:13px; margin:14px 0 4px; color:var(--suave); text-transform:uppercase; letter-spacing:.04em; }
  #lado p { margin:0 0 6px; }
  .rel { padding:5px 0; border-bottom:1px solid #E4E7EB; cursor:pointer; }
  .rel:hover { background:#F0F4F8; }
  .mas { color:var(--mas); font-weight:700; } .menos { color:var(--menos); font-weight:700; }
  .eti { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; border:1px solid var(--linea); color:var(--suave); margin-right:4px; }
  .leyenda { font-size:12px; color:var(--suave); line-height:1.5; }
  .leyenda i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
  text.nodo { font-size:10px; fill:var(--tinta); pointer-events:none; }
  text.clu { font-size:13px; font-weight:700; pointer-events:none; }
  .apagado { opacity:.08; }
  @media (max-width: 800px) { #cuerpo { flex-direction:column; height:auto; } #lienzo { height:70vh; } #lado { width:auto; border-left:0; border-top:1px solid var(--linea); } }
</style>
</head>
<body>
<header>
  <h1 id="titulo"></h1>
  <div class="ctrl">Confianza mínima
    <select id="fConf"><option value="0">Añadir conjeturas</option><option value="-1">Añadir también hipótesis del analista</option><option value="1" selected>Baja o superior</option><option value="2">Media o superior</option><option value="3">Solo alta</option></select>
  </div>
  <div class="ctrl"><label><input type="checkbox" id="fDisp"> Solo disputadas</label></div>
  <div class="ctrl">Buscar <input type="text" id="fBusca" placeholder="variable..." size="16"></div>
  <div class="ctrl" id="cuenta"></div>
</header>
<div id="cuerpo">
  <svg id="lienzo"></svg>
  <aside id="lado"></aside>
</div>

9-2020); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple.","co":"Dube y Lindner (2024) p. 64: el efecto en la desigualdad de renta es más débil que en la salarial (muchos hogares pobres no tienen ocupados)"},{"id":"R404","de":"E32","a":"E24","p":"-","m":"Sube la renta de las familias con trabajadores de salario bajo por encima del umbral, aunque parte se pierde en transferencias","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Arranz y García-Serrano (2025), Social Science Research 127, 103143, secc. 6-7 · Dube (2018) NBER WP 25240 (AEJ Applied 2019) pp. 4-5, 17-18 y 22-23 (causal (DID con datos de España) + causal en EE. UU.; ES (2016-2019) y EE. UU. (1984-2013); lectura: texto principal salvo robustez 3.3-3.4). Nivel en el inventario: FIRME. Vínculo: aproximado: la fuente mide la pobreza monetaria con el umbral federal, no la AROPE.","co":"Dube y Lindner (2024) p. 65: evidencia mixta en EE. UU. (Burkhauser et al. 2023 y Sabia y Nielsen 2015 sin efecto, no leídos)"},{"id":"R405","de":"E32","a":"E31","p":"-","m":"Más ingreso, menos dificultad para llegar a fin de mes","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Reeves et al. (2016) Health Economics DOI 10.1002/hec.3336 pp. 9 y 12 tabla V (causal (diferencias en diferencias con dos grupos de control); Otro país: Reino Unido (1998-1999); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide «cómo se las arregla económicamente», uno de los componentes de E31.","co":"Muestra pequeña (63 tratados)"},{"id":"R406","de":"E32","a":"S24","p":"+","m":"Menos tensión financiera, mejor salud mental","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Reeves et al. (2016) Health Economics DOI 10.1002/hec.3336 pp. 7-9 (causal (diferencias en diferencias con dos grupos de control); Otro país: Reino Unido (1998-2001); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide la salud mental (GHQ-12), no la satisfacción vital.","co":"Sin efecto en tensión arterial ni tabaco. Gülal y Ayaita (2020) Alemania: satisfacción vital +0,10 DT, no leído"},{"id":"R407","de":"E32","a":"E77","p":"+","m":"Las empresas trasladan buena parte del coste a los precios, sobre todo donde todas las competidoras sufren la subida","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Harasztosi y Lindner (2019) AER 109(8) pp. 2695 y 2707-2708, Fernández Cerezo e Izquierdo (2025) BdE BE 2025/T1 p. 10 (causal (Hungría) + encuesta a empresas (España); Hungría (2001-2004) y ES (2019-2025); lectura: texto principal salvo el modelo). Nivel en el inventario: APOYO. Vínculo: cumple.","co":"Dube y Lindner (2024) p. 66: el gasto de los consumidores sube poco (≈0,5 % por una subida del 20 %, MaCurdy 2015, no leído)"},{"id":"R409","de":"E32","a":"E80","p":"+","m":"La base mínima de cotización es el SMI más un sexto, y suben los salarios","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"AIReF (2025) DT 10/25 pp. 7-8 y 10-17 cuadro 1 (modelo calibrado (MTA, OEGEM, MEGAIReF); ES (2020-2050); lectura: secciones (parte del SMI completa)). Nivel en el inventario: DÉBIL. Vínculo: cumple.","co":"Con el canal de costes en MEGAIReF las cotizaciones bajan un 0,1 % en nivel. Escenario base con el SMI congelado desde 2019: sobrestima"},{"id":"R413","de":"E60","a":"E28","p":"-","m":"Quien pierde el empleo pasa al paro o a la inactividad","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Casi contable pero no del todo (salida a inactividad). Hace falta para que el coste del SMI llegue al malestar por la misma vía que antes daba la fusión empleo → paro (R034-R040)"},{"id":"R414","de":"T34","a":"E26","p":"-","m":"Reclasificados como asalariados, quienes cobraban menos del salario mínimo pasan a cobrarlo y ganan protección social","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Comisión Europea (2021) SWD(2021) 396 final pp. 7 y 36 · Esade (2022) Ley rider. Un año después, pp. 3-4 y 19-20 (en colaboración con Just Eat) (informe (estimación ex ante con supuestos, estudio PPMI 2021); UE-27; lectura: secciones (pp. 7-9 y 33-37)). Nivel en el inventario: DÉBIL. Vínculo: aproximado: la fuente estima ingresos y afirma que la pobreza laboral bajaría, sin medirla.","co":"Dolado et al. (2025) p. 27: en España el salario medio por hora de los repartidores baja un 3,3 % en el modelo. Sanz de Miguel et al. (2023) pp. 7-12 y 15: tras la ley, devaluación salarial y huida de la laboralidad (cualitativo). Comisión Europea p. 37: puede bajar el salario de quien ya cobraba más del mínimo"},{"id":"R415","de":"T34","a":"E80","p":"+","m":"Como asalariados, la plataforma cotiza por ellos","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Comisión Europea (2021) SWD(2021) 396 final p. 35, Dolado et al. (2025) IZA DP 17740 p. 9 (informe (estimación ex ante) + descriptivo de segunda mano; UE-27 y ES; lectura: secciones). Nivel en el inventario: DÉBIL. Vínculo: cumple.","co":"Parte de la contratación se hace con subcontratas y flotas que eluden convenios (Sanz de Miguel et al. 2023 pp. 9-12)"},{"id":"R416","de":"T34","a":"E77","p":"+","m":"Reclasificar encarece el servicio y parte se traslada al cliente","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Comisión Europea (2021) SWD(2021) 396 final p. 35 (informe (estimación a partir de estudios de caso, PPMI 2021); UE-27; lectura: secciones). Nivel en el inventario: DÉBIL. Vínculo: aproximado: E77 son los precios de los sectores intensivos en salario bajo y la fuente habla del precio de los servicios de plataforma.","co":"La subida sería menor en mercados competitivos (p. 35)"},{"id":"R418","de":"T34","a":"E81","p":"+","m":"La presunción de laboralidad convierte autónomos en asalariados","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Dolado et al. (2025) IZA DP 17740 pp. 9 y 28 tabla 4 (modelo calibrado + descriptivo de segunda mano (Esade 2022); ES (2021-2023); lectura: texto completo). Nivel en el inventario: DÉBIL. Vínculo: cumple.","co":"Sanz de Miguel et al. (2023) pp. 7-12: Glovo mantuvo autónomos y Uber Eats y Just Eat pasaron a subcontratas con contratos temporales y parciales"},{"id":"R419","de":"E52","a":"S05","p":"+","m":"Más gasto por alumno (menos alumnos por profesor, mejores salarios docentes, curso más largo) alarga la escolarización, sobre todo de los hijos de familias de renta baja","r":">3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Jackson, Johnson y Persico (2015) NBER WP 20847 pp. 3-4, 23-26 y 39-41 (QJE, DOI 10.1093/qje/qjv036) (causal (variables instrumentales con reformas de la financiación escolar ordenadas por tribunales, estudio de eventos); Otro país: EE. UU. (cohortes de 1955-1985); lectura: secciones I, II.a-b, V (sin la robustez V.a) y VII). Nivel en el inventario: APOYO. Vínculo: cumple.","co":"Los autores advierten que el gasto que el distrito sube por su cuenta puede ir a usos menos productivos (p. 41). Sin estudio causal de España localizado"},{"id":"R420","de":"E52","a":"E24","p":"-","m":"Más estudios y mejor escuela dan más salario y menos pobreza en la edad adulta","r":">3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Jackson, Johnson y Persico (2015) NBER WP 20847 pp. 27-30 y 40 (causal (variables instrumentales y estudio de eventos); Otro país: EE. UU. (cohortes de 1955-1985); lectura: secciones I, II.a-b, V (sin la robustez V.a) y VII). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide la incidencia anual de la pobreza adulta con el umbral federal, no la AROPE, y el efecto llega décadas después.","co":"Efecto pequeño y no significativo en los hijos de familias no pobres (p. 30)"},{"id":"R423","de":"E82","a":"E28","p":"+","m":"Con una prestación o un subsidio más generosos el parado tarda más en aceptar un empleo","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Rebollo-Sanz y Rodríguez-Planas (2016) IZA DP 10044 pp. 4-6, 25-27 y 38-41 (Journal of Human Resources 55(1) según OpenAlex, sin verificar), Domènech-Arumí y Vannutelli (2023) NBER WP 30301 pp. 3-5 y 13-15 (causal (diferencias en diferencias con las reformas de julio de 2012, MCVL); ES (2011-2014); lectura: secciones 1-3, 6.1, 6.3, 6.4 y 7 (Rebollo-Sanz) y texto completo (Domènech-Arumí)). Nivel en el inventario: FIRME. Vínculo: aproximado: las fuentes miden la probabilidad individual de encontrar empleo y la duración sin empleo de quien cobra, no la tasa de paro.","co":"Flores, Benavides y Serra-Saurina (2024) UAB WP 24-03 p. 27: con la misma reforma, en Cataluña el empleo sube antes del sexto mes y el efecto es ≈0 a los 17 meses. Domènech-Arumí y Vannutelli p. 14: recortar el subsidio de mayores también sacó a un 4 % más de la población activa. Efecto solo con salario previo por debajo de la mediana (Rebollo-Sanz p. 26) y mayor en trabajadores con hijos, por liquidez (p. 40)"},{"id":"R424","de":"E82","a":"E50","p":"+","m":"La prestación por desempleo es una parte del gasto en protección social","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. Eurostat gov_10a_exp, COFOG GF1005 «Unemployment» dentro de GF10 (contable).","co":""},{"id":"R425","de":"S20","a":"S52","p":"+","m":"Los afiliados a un sindicato trabajan más en un partido o un grupo de acción","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Bryson et al. (2014), tabla 6, columna 1 (correlacional; UE (29 países ESS, con ES); lectura: texto completo (equipo de apoyo)). Nivel en el inventario: APOYO. Vínculo: cumple.","co":""},{"id":"R426","de":"S19","a":"S52","p":"+","m":"La pertenencia asociativa es el mejor predictor de la participación convencional (trabajar por la comunidad o en un partido, hablar de política)","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Torcal y Montero (1998), Kellogg WP 259, tabla 8 (correlacional; ES (CIS 1996); lectura: texto completo (equipo de apoyo)). Nivel en el inventario: APOYO. Vínculo: cumple.","co":""},{"id":"R427","de":"S18","a":"S52","p":"+","m":"La confianza interpersonal facilita la participación convencional","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Torcal y Montero (1998), tabla 8 (correlacional; ES (1996); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple.","co":""},{"id":"R428","de":"L48","a":"S52","p":"+","m":"Quien confía en las instituciones participa más por cauces institucionales (afiliarse o trabajar en un partido o grupo de acción, contactar con cargos públicos)","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Hooghe y Marien (2013), European Societies 15(1), tabla 2 (correlacional multinivel; UE (ESS 2006, 25 países); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple.","co":""},{"id":"R430","de":"E82","a":"S24","p":"+","m":"Perder o recortar la prestación aumenta el estrés financiero y empeora la salud física y mental de los parados","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Flores, Benavides y Serra-Saurina (2024) UAB WP 24-03 pp. 21-29, García-Pérez, Serrano-Alarcón y Vall Castelló (2020) IEB WP 2020/16 pp. 13-21 (Journal of Population Economics 37(1) 2024 según OpenAlex) (causal (diferencias en diferencias y triple diferencia con las reformas de julio de 2012, MCVL enlazada con bajas médicas, altas hospitalarias y atención primaria); ES (2011-2015); lectura: texto completo (texto principal de ambas)). Nivel en el inventario: FIRME. Vínculo: aproximado: las fuentes miden bajas médicas certificadas, hospitalizaciones por lesiones y diagnósticos de salud mental, no la satisfacción vital, y García-Pérez et al. estudian el subsidio de mayores de 52 años, no la prestación contributiva.","co":"Flores et al. pp. 22-23: parte de las bajas puede ser riesgo moral (la baja paga el 75 % frente al 50 % del paro), aunque el efecto se concentra en bajas largas y ligadas al estrés. García-Pérez et al.: nada significativo en mujeres ni en recetas. Ahammer y Packham (2023) Austria: mejora en mujeres, no en hombres"},{"id":"R431","de":"E82","a":"E31","p":"-","m":"La prestación sustituye la mayor parte de la renta perdida y los parados apenas tienen ahorro con que suavizar el consumo","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Kolsrud, Landais, Nilsson y Spinnewijn (2015) IZA DP 9185 pp. 3-4 y 27-28 (American Economic Review 108(4-5) según OpenAlex) (descriptivo con efectos fijos individuales sobre registros fiscales y de patrimonio; UE: Suecia (1999-2007); lectura: secciones (introducción y consumo, que sostienen las cifras)). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide la caída del gasto de los parados y qué parte cubren las transferencias, no la inseguridad económica percibida.","co":"García-Pérez, Serrano-Alarcón y Vall Castelló (2020) p. 15: al perder el subsidio de mayores la renta formal media no cambió, porque los que encontraron empleo compensan a los que se quedaron sin ingresos"},{"id":"R432","de":"E82","a":"E24","p":"-","m":"La prestación contributiva saca de la pobreza a una parte de los hogares con algún parado","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Tejero, López-Rodríguez y Gutiérrez (2024) Papers 109(2) e3145 pp. 14-19, López Laborda, Marín González y Onrubia (2026) Fedea EEE 2026-13 p. 22 (incidencia estática (renta antes y después de transferencias) y logit; ES (ECV 2019 y 2023); lectura: texto completo (Tejero et al.) y secciones 1-4 (Fedea)). Nivel en el inventario: DÉBIL. Vínculo: aproximado: las fuentes miden la pobreza monetaria antes y después de la prestación, no la AROPE, y el contrafactual ignora que sin prestación algunos trabajarían antes.","co":"Domènech-Arumí y Vannutelli (2023) p. 14: al recortar el subsidio de mayores, la mayoría pasó a otros subsidios casi uno a uno. García-Pérez et al. (2020) p. 15: renta formal media sin cambio"},{"id":"R440","de":"E35","a":"E01","p":"-","m":"Más impuestos restan renta disponible y rentabilidad, y caen el consumo y sobre todo la inversión","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Gil, Martí, Morris, Pérez y Ramos (2017) Banco de España DT 1721 pp. 5, 18-19, 21-22 y 26 (SERIEs 10(1) según OpenAlex) (causal (registro narrativo de cambios legislados, VAR con la serie exógena); ES (1986-2015); lectura: texto completo (texto principal)). Nivel en el inventario: FIRME. Vínculo: cumple.","co":"Los autores avisan de bandas de confianza anchas. Estudios previos con VAR estructural daban efecto positivo a corto plazo en España (pp. 8)"},{"id":"R441","de":"E35","a":"E83","p":"+","m":"Al subir el tipo marginal crecen las deducciones, el traslado de rentas y la planificación para pagar menos","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Almunia y López-Rodríguez (2019) Banco de España DT 1924 pp. 5 y 24-28 (SERIEs 10(3-4) según OpenAlex) (causal (variables instrumentales en diferencias con las reformas del IRPF de 2003, 2007 y 2012, panel del IEF); ES (1999-2014); lectura: secciones 1 y 5 (las que sostienen las cifras)). Nivel en el inventario: FIRME. Vínculo: aproximado: la fuente mide la elasticidad de la renta gravable al tipo marginal del IRPF, que incluye también respuesta real, no la presión fiscal agregada.","co":"López-Laborda y Rodrigo (2022) Economics 16 pp. 157 y 163 (APOYO): las diferencias autonómicas de IRPF, Patrimonio y Sucesiones mueven al 1 % más rico, el 59,3 % hacia Madrid. Agrawal y Foremny (2019) REStat, PENDIENTE"},{"id":"R442","de":"E37","a":"E83","p":"+","m":"Al subir el tipo de las rentas del capital se difiere su realización o se cambian a formas menos gravadas","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Almunia y López-Rodríguez (2019) Banco de España DT 1924 p. 27 (causal (variables instrumentales en diferencias con las reformas del IRPF, entre ellas el paso del capital a la base del ahorro en 2007); ES (1999-2014); lectura: secciones 1 y 5). Nivel en el inventario: FIRME. Vínculo: aproximado: la fuente mide la elasticidad de la renta declarada por tipo de renta, no solo elusión.","co":"Martínez-Toledano (2020) y R002: la rebaja de 2007 subió la renta por intereses declarada de los tramos altos y su cuota de riqueza (la otra cara de E37)"},{"id":"R444","de":"E83","a":"E35","p":"-","m":"La base que se elude deja de recaudarse","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Durán-Cabré, Esteller-Moré y Mas-Montserrat (2019) IEB WP 2019/04 pp. 3 y 32 (causal (como R443); ES: Cataluña (2011-2015); lectura: secciones 1 y 6 (no 5.3, donde se calcula)). Nivel en el inventario: APOYO. Vínculo: aproximado: E35 es una decisión que se mide como recaudación sobre el PIB (como R029), y la fuente mide solo Patrimonio.","co":""},{"id":"R445","de":"E83","a":"E36","p":"-","m":"La elusión se concentra arriba y el impuesto pierde progresividad","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Durán-Cabré, Esteller-Moré y Mas-Montserrat (2019) IEB WP 2019/04 p. 32, López Laborda, Marín González y Onrubia (2026) Fedea EEE 2026-13 pp. 24 y 26-27 (afirmación de los autores + incidencia estática; ES; lectura: secciones). Nivel en el inventario: DÉBIL. Vínculo: aproximado: ninguna fuente mide la progresividad perdida por la elusión.","co":""},{"id":"R447","de":"E35","a":"E61","p":"-","m":"Parte del impuesto sobre beneficios se traslada a los trabajadores en la negociación salarial","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Fuest, Peichl y Siegloch (2015) IZA DP 9606 pp. 3-5 y 41-42 (causal (estudio de eventos con 18.000 cambios del impuesto municipal sobre actividades); UE: Alemania (1993-2012); lectura: secciones (introducción y conclusiones)). Nivel en el inventario: DÉBIL. Vínculo: aproximado: la fuente mide un impuesto local sobre beneficios, no la presión fiscal.","co":"Efecto casi nulo en empresas que trasladan beneficios entre municipios o países (p. 42)"},{"id":"R448","de":"E84","a":"E01","p":"+","m":"El gasto en servicios públicos es demanda directa y, con recursos ociosos, arrastra al sector privado. Recortarlo en una recesión deja una pérdida que persiste","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Hernández de Cos y Moral-Benito (2013) Banco de España DT 1309 pp. 5, 9 y 21-27 (Empirical Economics 50(4) según OpenAlex), Gabriel, Klein y Pessoa (2022) Sveriges Riksbank WP 418 pp. 23-25, Gechert, Horn y Paetz (2017) IMK WP 179 pp. 4 y 8-16 (Oxford Bulletin of Economics and Statistics 81(3): 647-666 según OpenAlex) (causal regional (instrumento tipo Bartik con consolidaciones narrativas) + serie temporal (VAR con transición suave) + errores de previsión regresados sobre la consolidación planeada; ES y UE (124 regiones de 8 países con ES 1980-2015, 21-22 países europeos con ES 2010-2011); lectura: secciones 4.1-4.4 (Gabriel), 1, 4 y 5 (Hernández de Cos), texto principal (Gechert)). Nivel en el inventario: FIRME. Vínculo: cumple.","co":"Hernández de Cos y Moral-Benito p. 23: con finanzas públicas débiles el multiplicador es ≈0 o negativo. Ilzetzki, Mendoza y Végh (2012) NBER WP 16479 p. 20: con deuda del Gobierno central por encima del 60 % del PIB, multiplicador ≈0 al impacto y −3 a largo plazo (DÉBIL, muestra sin verificar). Gechert et al. p. 15: el efecto se debilita en 2013-2014"},{"id":"R449","de":"E84","a":"P47","p":"-","m":"Los recortes del gasto en servicios dañan la economía local y la confianza y llevan voto a los extremos","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Gabriel, Klein y Pessoa (2022) Sveriges Riksbank WP 418 pp. 3-5, 8-10 y 18-23 (causal (instrumento tipo Bartik con consolidaciones narrativas, proyecciones locales); UE (124 regiones de 8 países con ES, 1980-2015); lectura: secciones 1, 2, 4.1 y 4.1.1). Nivel en el inventario: FIRME. Vínculo: aproximado: la fuente mide el voto a partidos de extrema izquierda y extrema derecha y un gasto aproximado por la masa salarial y las compras del sector público, no las transferencias.","co":"Con el choque de austeridad del FMI el efecto es 0,49 puntos en vez de 1,54 (p. 23)"},{"id":"R450","de":"E84","a":"P01","p":"+","m":"Tras los recortes vota menos gente","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Gabriel, Klein y Pessoa (2022) Sveriges Riksbank WP 418 p. 20 (causal (como R449); UE (124 regiones de 8 países con ES); lectura: secciones 1, 2 y 4.1). Nivel en el inventario: FIRME. Vínculo: aproximado: participación sobre el censo en elecciones regionales, nacionales y europeas.","co":""},{"id":"R451","de":"E84","a":"E22","p":"-","m":"Recortar el gasto quita servicios y transferencias en especie a la mitad inferior y sube el paro","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Heimberger (2018) wiiw WP 147 pp. 5 y 19-21 (panel entre países con consolidaciones identificadas por el método narrativo (proyecciones locales); 17 países de la OCDE con ES (1978-2013); lectura: secciones 1, 3 y 4.1). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide episodios de consolidación (gasto e impuestos), no el nivel del gasto en servicios.","co":""},{"id":"R452","de":"E84","a":"E60","p":"+","m":"Menos gasto en servicios es menos empleo público y menos demanda","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Gabriel, Klein y Pessoa (2022) Sveriges Riksbank WP 418 pp. 5-6 y 23-25 (causal (instrumento tipo Bartik con consolidaciones narrativas, proyecciones locales); UE (124 regiones de 8 países con ES, 1980-2015); lectura: secciones 1, 2, 4.1 y 4.2). Nivel en el inventario: FIRME. Vínculo: cumple.","co":""},{"id":"R453","de":"E50","a":"E85","p":"+","m":"El gasto en prestaciones es gasto público","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. IGAE y Eurostat gov_10a_main (definición del saldo de las AA. PP.) (contable juste cae tras 2000. Belmonte y Polo (2004), con datos hasta 2001: −0,74"},{"id":"R459","de":"E85","a":"E86","p":"+","m":"La deuda acumula los déficits de cada año, más los ajustes entre flujo y fondo","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. AIReF (2026) Observatorio de Deuda, octubre de 2026, pp. 1 y 3 (contable).","co":""},{"id":"R460","de":"E86","a":"E88","p":"+","m":"A un tipo de interés dado, más deuda es más gasto en intereses","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. AIReF (2026) Observatorio de Deuda pp. 6-10 (contable).","co":""},{"id":"R461","de":"E88","a":"E85","p":"+","m":"Los intereses son gasto público y aumentan el déficit total","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. AIReF (2026) Observatorio de Deuda p. 3, Eurostat gov_10a_main (intereses pagados por las AA. PP.) (contable).","co":""},{"id":"R462","de":"E87","a":"E88","p":"+","m":"Las emisiones nuevas se hacen a tipos más altos y, al refinanciar, suben el tipo medio de toda la cartera","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. AIReF (2026) Observatorio de Deuda pp. 2 y 7-10 (contable (refinanciación según la vida media de la cartera, con escenarios de la AIReF)).","co":""},{"id":"R464","de":"E87","a":"E28","p":"+","m":"Una prima más alta encarece la financiación de empresas y hogares, se frena el crédito y sube el paro","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Bahaj (2020) Journal of Monetary Economics 110: 116-135, versión aceptada de 24/10/2018 pp. 3-4, 17-18 y 22-28 (causal (reacción intradía a sucesos de otros países como instrumento externo de un VAR bayesiano en panel); UE: Italia, España, Portugal e Irlanda (2007-2013); lectura: texto principal (secciones 1-4 y 5)). Nivel en el inventario: FIRME. Vínculo: cumple.","co":"Bahaj p. 25 nota 28: en España la diferencia con el contrafactual solo es significativa con intervalos del 68 %. Resultados de una crisis en una unión monetaria, quizá no generalizables (p. 28)"},{"id":"R465","de":"E87","a":"E01","p":"-","m":"Una prima más alta frena la actividad por la vía financiera","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Bahaj (2020) JME 110 pp. 4 y 23, Altavilla, Giannone y Lenza (2014) BCE WP 1707 pp. 2-3, 8 y 13-14 (International Journal of Central Banking 12(3) según OpenAlex, sin verificar) (causal (instrumento externo) + escenario de un VAR bayesiano calibrado con un estudio de eventos; UE con ES (2007-2015); lectura: texto principal). Nivel en el inventario: APOYO. Vínculo: aproximado: Bahaj mide la producción industrial, no el PIB.","co":""},{"id":"R466","de":"E87","a":"E84","p":"-","m":"Con el crédito más caro el Gobierno recorta la inversión pública","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Picarelli, Vanlaer y Marneffe (2019) ESM WP 36 pp. 17-18, 22 y 26 (correlacional (panel con efectos fijos y GMM); UE: 26 países con ES (1995-2015); lectura: texto completo). Nivel en el inventario: DÉBIL. Vínculo: aproximado: la fuente mide la inversión pública, una parte de E84, y el tipo a diez años, no el diferencial.","co":"Los autores dicen que el efecto del tipo solo aparece en algunas especificaciones (pp. 18 y 26)"},{"id":"R467","de":"E86","a":"E84","p":"-","m":"Con mucha deuda los gobiernos recortan la inversión pública antes que otras partidas","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Picarelli, Vanlaer y Marneffe (2019) ESM WP 36 pp. 1 y 20-24 (correlacional (panel dinámico con GMM y la deuda instrumentada con la de los demás países); UE: 26 países con ES (1995-2015); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide la inversión pública (formación bruta de capital de las AA. PP.), una parte de E84.","co":"El efecto se concentra en los países de deuda alta y es menor en la zona del euro (0,018 frente a 0,03). No hay umbral del 60 % ni del 90 %"},{"id":"R468","de":"E86","a":"E85","p":"-","m":"Los gobiernos responden a una deuda más alta con más saldo primario: la deuda de hoy obliga a ajustar mañana","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Checherita-Westphal y Žďárek (2017) BCE WP 2036 pp. 1-2 y 9-11, Heimberger (2024) wiiw WP 253 pp. 24-25 (Review of Evolutionary Political Economy 6(3) según OpenAlex) (correlacional (función de reacción fiscal en panel con variables instrumentales) + reglas fiscales de la UE de 2024 (proyección); UE: 18 países de la zona del euro con ES (1970-2013) y reglas de 2024; lectura: secciones 1-4 (Checherita-Westphal) y 2-4 (Heimberger)). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide el saldo primario, E85 es el saldo total.","co":"Checherita-Westphal y Žďárek p. 11: el coeficiente de España por separado no es significativo. Ghosh et al. (2013), citados en p. 5: con deudas del 90-100 % la reacción se debilita (fatiga fiscal)"},{"id":"R469","de":"E86","a":"E50","p":"-","m":"La consolidación que sigue a la deuda incluye congelar pensiones y prestaciones","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Avram et al. (2013) EUROMOD WP EM 2/13 pp. 8 y 10-13, Heimberger (2024) wiiw WP 253 pp. 17-18 (microsimulación de las medidas aprobadas en 2010-2012 y registro narrativo de la consolidación; ES y otros 8 países de la UE (2010-2012); lectura: texto completo (Avram) y secciones 2-3 (Heimberger)). Nivel en el inventario: DÉBIL. Vínculo: aproximado: las fuentes describen qué recortó la consolidación española de 2010-2012, no estiman la reacción del gasto social a la deuda.","co":"Avram et al. p. 13: en España las prestaciones asistenciales absorbieron parte de la pérdida"},{"id":"R470","de":"E86","a":"E35","p":"+","m":"La consolidación que sigue a la deuda incluye subir impuestos","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Avram et al. (2013) EUROMOD WP EM 2/13 pp. 8, 13, 16 y 18-19 (microsimulación de las medidas aprobadas en 2010-2012; ES y otros 8 países de la UE (2010-2012); lectura: texto completo). Nivel en el inventario: DÉBIL. Vínculo: aproximado: como R469.","co":""},{"id":"R471","de":"E86","a":"E01","p":"-","m":"Una deuda que sigue creciendo frena el crecimiento a largo plazo","r":">3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Chudik, Mohaddes, Pesaran y Raissi (2015) Federal Reserve Bank of Dallas WP 245 pp. 1-3 y 19-23 y apéndice de datos (Review of Economics and Statistics 99(1): 135-150 según OpenAlex) (correlacional (panel dinámico heterogéneo con dependencia entre países, ARDL y DL aumentados); 40 países con ES (1965-2010); lectura: texto principal). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide el efecto del crecimiento de la ratio de deuda sobre el crecimiento del PIB.","co":"Chudik et al. pp. 3 y 23: una subida temporal para suavizar el ciclo no tiene efecto a largo plazo, y no hay umbral universal del 90 % (p. 19)"},{"id":"R472","de":"E84","a":"L48","p":"+","m":"Cuando la recesión viene de recortes la gente culpa al Gobierno y la confianza en el Parlamento cae más que en otras recesiones","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Gabriel, Klein y Pessoa (2022) Sveriges Riksbank WP 418 pp. 26-30 (causal (instrumento tipo Bartik por estados del ciclo) con el índice de confianza de Algan et al. (2017) sobre la ESS; UE (regiones de 8 países con ES, sin Francia ni Finlandia, 2000-2014); lectura: secciones 4.3 y 4.4). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente compara recesiones con y sin austeridad, no estima el efecto del gasto en tiempos normales.","co":""},{"id":"R473","de":"E50","a":"P46","p":"-","m":"Los recortes de prestaciones activan agravios ya existentes y llevan voto a la derecha radical","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Fetzer (2019) American Economic Review 109(11): 3849-3886, versión aceptada de 6/6/2019 pp. 2-3, 16-22, 28 y 31-34 (causal (diferencias en diferencias por exposición del distrito a la reforma del bienestar y panel individual con efectos fijos); UE: Reino Unido (2000-2016); lectura: texto principal salvo la sección 5.3). Nivel en el inventario: FIRME. Vínculo: aproximado: la fuente mide el voto y el apoyo al UKIP, partido euroescéptico de derecha, y las prestaciones a hogares en edad de trabajar, no todo el gasto en protección social.","co":"Fetzer p. 22: con datos agregados la lectura causal es difícil. Alesina et al. (1998, 2011) y Arias y Stasavage (2016), citados en p. 6, no encuentran coste político de la austeridad"},{"id":"R474","de":"E50","a":"L48","p":"+","m":"Quien pierde prestaciones siente que a los cargos no les importa y que no tiene voz","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Fetzer (2019) AER 109(11) pp. 31-32 (tabla 4) (causal (panel individual con efectos fijos); UE: Reino Unido (2009-2016); lectura: texto principal). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide la eficacia política externa, no la confianza en las instituciones.","co":""},{"id":"R476","de":"E35","a":"P46","p":"+","m":"Las subidas de impuestos de la austeridad, mayores en los tramos bajos, alimentan el voto a la extrema derecha","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Galofré-Vilà, Meissner, McKee y Stuckler NBER WP 24106 pp. 22-26 (causal (variables instrumentales con la distribución inicial por tramos y pares de distritos fronterizos); Otro país: Alemania (1930-1933); lectura: texto principal). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide el tipo medio de los impuestos sobre la renta y los salarios por distrito, no la presión fiscal.","co":"Los autores no explican por qué el efecto con variables instrumentales es 2-3 veces el de MCO (p. 24). Ponticelli y Voth (2020) pp. 2 y 6: las subidas de impuestos no aumentan la protesta. Hübscher, Sattler y Wagner (2021) pp. 12-13: subir impuestos solo a los ricos sube el apoyo al partido (no significativo en España)"},{"id":"R477","de":"E84","a":"S22","p":"-","m":"Los recortes de gasto provocan disturbios, manifestaciones y huelgas generales","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Ponticelli y Voth (2020) Journal of Comparative Economics 48(1): 1-19 pp. 1-13 (causal (variables instrumentales con las decisiones pasadas de los países vecinos) + correlación con efectos fijos; Europa: 24 países con ES (1919-2008); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide el gasto total del Gobierno central y episodios de disturbio de la base de Banks, no la protesta en general.","co":"Instrumento con F de 9,6 a 14,8 y exclusión discutible. Las subidas de impuestos no tienen efecto. Solo en democracias plenas (p. 12)"},{"id":"R478","de":"E84","a":"P67","p":"+","m":"Proponer recortes del gasto en servicios hunde el apoyo al Gobierno","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Hübscher, Sattler y Wagner (2021) British Journal of Political Science 51(4): 1751-1760, versión aceptada pp. 1-16 (causal (experimentos de encuesta con viñetas y conjoint, ≈2.200 personas por país); UE: España, Portugal, Italia, Alemania y Reino Unido (2018); lectura: texto principal). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide la intención de votar contra el Gobierno ante un anuncio hipotético, no la valoración de su gestión.","co":"Bansak, Bechtel y Margalit (2021) APSR 115(2) pp. 489-491 y 500 (DÉBIL, encuesta): en España la mayoría prefiere en abstracto reducir gasto y deuda a gastar más con más deuda, y el paquete español aplicado recibiría ≈50 % de apoyo"},{"id":"R479","de":"E51","a":"S53","p":"-","m":"Sin cobertura ni recursos sanitarios se interrumpen tratamientos y diagnósticos y suben las muertes evitables","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Juanmarti Mestres, López Casasnovas y Vall Castelló (2021) European Economic Review 131: 103608, versión de noviembre de 2020 pp. 5 y 9-18, Borra, Pons y Vilar (2017) MPRA 79736 pp. 6-12 (causal (diferencias en diferencias con el RDL 16/2012) + panel regional con efectos fijos y tendencias; ES (2009-2015 y 1997-2014); lectura: texto principal). Nivel en el inventario: FIRME. Vínculo: aproximado: las fuentes miden la exclusión de la sanidad pública de los inmigrantes sin papeles y la dotación de personal y camas, no el gasto sanitario.","co":"Borra et al. p. 9: tras la exclusión bajó la mortalidad por cáncer de los residentes (≈3 %) y el copago de 2012 no tuvo efecto robusto. Las recesiones bajan la mortalidad total (−6 % por 10 puntos de paro, p. 11)"},{"id":"R480","de":"E28","a":"P46","p":"+","m":"Con más paro sube el voto a la extrema derecha nacionalista en todos los grupos de países","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Algan, Guriev, Papaioannou y Passari (2017) BPEA pp. 18-19 (tabla 2 panel C y tabla 3 panel B) (causal (MC2E: peso previo de la construcción); UE (26 países, regiones NUTS-2, con ES); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple.","co":"Algan et al. p. 18: sin efectos de periodo por grupo de países el coeficiente de la extrema derecha es pequeño y no significativo"},{"id":"R481","de":"E84","a":"P46","p":"-","m":"Los recortes del gasto en servicios llevan voto a la extrema derecha","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Gabriel, Klein y Pessoa (2022) Sveriges Riksbank WP 418 pp. 3-5 y 21-22 (causal (instrumento tipo Bartik con consolidaciones narrativas, proyecciones locales); UE (124 regiones de 8 países con ES, 1980-2015); lectura: secciones 1, 2, 4.1 y 4.1.1). Nivel en el inventario: FIRME. Vínculo: aproximado: la fuente mide el voto a partidos de extrema izquierda y extrema derecha y un gasto aproximado por la masa salarial y las compras del sector público, no las transferencias.","co":"Con el choque de austeridad del FMI el efecto es 0,49 puntos en vez de 1,54 (p. 23)"},{"id":"R483","de":"P46","a":"P47","p":"+","m":"El voto a la derecha radical forma parte del voto populista o antiestablishment","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. Definiciones de P46 y P47 (variables.csv) (contable).","co":""},{"id":"R484","de":"E01","a":"E86","p":"-","m":"La ratio de deuda baja cuando el PIB nominal crece más deprisa que la deuda (efecto denominador)","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. AIReF (2026) Observatorio de Deuda, octubre de 2026, pp. 1 y 3 (contable).","co":""},{"id":"R485","de":"P46","a":"P71","p":"+","m":"Los escaños de la derecha radical permiten investir gobiernos que dependen de su apoyo o la incluyen","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Rodríguez López (2021), p. 24 (Andalucía 2018-2019) · gobiernos autonómicos PP-Vox 2022-2024 sin verificar con boletín (descriptiva (caso); ES; lectura: texto completo (la afirmación es secundaria en el TFM)). Nivel en el inventario: DÉBIL. Vínculo: aproximado: la fuente habla de escaños, no del porcentaje de voto.","co":""},{"id":"R486","de":"P01","a":"P17","p":"+","m":"Quien vota se polariza más después y quien se abstiene se despolariza","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Cálculo propio POLAT (calibracion_datos.js) (panel con retardos cruzados (correlacional); ES (panel en línea, cinco generales 2011-2019); lectura: cálculo completo). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide el voto individual, no la tasa de participación.","co":""},{"id":"R488","de":"S14","a":"S54","p":"-","m":"Bajo estatus, más idea de que los inmigrantes socavan la cultura","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Gidron y Hall (2017), tabla III (correlacional; Otro país: 21 países ISSP, con ES; lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple (ítem «la cultura nacional se ve socavada por los inmigrantes», estimado por separado en la tabla III).","co":""},{"id":"R489","de":"T35","a":"S54","p":"+","m":"Más nativismo","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Anelli et al. (2021), fig. 4 (causal (variables instrumentales, «sugerente»); UE (13 países, con ES); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: aproximado: el índice de nativismo de la fuente es la media de los dos ítems (economía y vida cultural) y no permite atribuir el efecto a uno de los dos.","co":""},{"id":"R492","de":"P17","a":"S54","p":"+","m":"Polarizarse sube el rechazo cultural a la inmigración","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"cálculo propio con POLAT (analisis/inmigracion_polarizacion.md) (correlacional (panel con retardos cruzados); ES; lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple (+0,032 puntos del ítem cultural por punto de AP2, IC95 0,019 a 0,044).","co":""},{"id":"R494","de":"T27","a":"L48","p":"+","m":"Quien ve limpias las elecciones confía más en el Parlamento, los partidos y la justicia, y perder la elección baja la confianza en parte porque hace dudar de la limpieza","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Mauk (2022) Quality & Quantity 56 pp. 1711-1712, 1716 y 1720-1725, tabla 3 y fig. 2 (correlacional (ecuaciones estructurales multinivel, ESS 2012-2013, Asian Barometer y Latinobarómetro, 45 democracias, 40.281 personas); UE con España (ESS 6, campo de 2013) y otros países; lectura: texto completo (tabla 3 ilegible en la extracción, se cita el texto)). Nivel en el inventario: APOYO. Vínculo: aproximado: la confianza es un factor de Parlamento, justicia, policía y partidos (sin Gobierno), la limpieza es «cuán libres y limpias fueron las últimas elecciones».","co":"Corte transversal: la confianza institucional puede colorear la percepción de limpieza. Birch (2010 p. 16): la percepción de limpieza no es solo satisfacción con la democracia (tau-b 0,274). Norris (2014) y Alemika (2007), citados por Mauk, no leídos"},{"id":"R495","de":"T27","a":"P46","p":"-","m":"Quien duda de la limpieza de las elecciones, si vota, se inclina por el partido de derecha radical que la cuestiona","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Schnaudt (2023) Politische Vierteljahresschrift 64 pp. 87-88, 93-94 y 97-98, fig. 2 (correlacional (preelectoral GLES 2021, logit multinomial preregistrado, N = 4.161); UE (Alemania, AfD); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple (la escala de integridad incluye «el voto por correo es seguro»).","co":"El propio Schnaudt (p. 94) reconoce la endogeneidad, y la AfD presentó en 2021 el voto por correo como vía al fraude (p. 82): el voto puede formar la creencia (P46 → T27). Bernhard-Rump (2026) trata el voto a AfD y FPÖ como causa de las creencias (leído por secciones, tabla incoherente). Sin dato de España con limpieza y voto a Vox"},{"id":"R497","de":"P23","a":"L49","p":"-","m":"Más partidos van con menos satisfacción con la democracia, entre países y dentro de cada país cuando la fragmentación sube, aunque los autores no prueban el mecanismo (p. 26), y el efecto sobre el votante del ganador que da el CSES es de la fraccionalización del gobierno, no del NEP","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Christmann y Torcal, PSRM 6(3):593-611, doi 10.1017/psrm.2017.23, tabla 1 modelo 3 (p. 20 de la versión aceptada) y pp. 19-27 (correlacional (multinivel within-between con Mundlak, panel de 58 democracias 1990-2012, más CSES); Comparado mundial, mayoría europea (58 democracias, 300 elecciones), presencia de España no comprobada en el texto; lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: cumple (NEP electoral de Bormann y Golder, satisfacción agregada en % de satisfechos).","co":"Christmann (2017) tesis UPF tabla 17 p. 97: en España 1986-2014 NEP → satisfacción −0,04 (e. t. 0,04) n.s. con muy poca variación del NEP. Miller y Listhaug (1990): partidos nuevos que canalizan el descontento recuperan la confianza (Noruega)"},{"id":"R498","de":"P23","a":"P38","p":"+","m":"Con más partidos hay más coaliciones posibles y cuesta más formar y sostener un gobierno","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Bäck, Hellström, Lindvall y Teorell, West European Politics 47(1):88-112, doi 10.1080/01402382.2023.2200328, tabla 2 (p. 98) y p. 99, Parra Gómez (ponencia AECPA, datos al 5/03/2019) pp. 3, 6 y 8, Simón (2020) SESP 25(3-4) p. 13 del postprint (correlacional (binomial negativa con efectos fijos de país, 336-384 formaciones) y descriptiva (recuento en congreso.es); Europa occidental (17 países con España, 1945-2019) y ES (XI y XII legislaturas); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente comparada mide días de formación de gobierno con una fragmentación ponderada por Banzhaf, no el NEP de Laakso-Taagepera, y P38 se toma como inestabilidad (ver la modificación propuesta de P38).","co":"Montilla Martos (2022) ReDCE 38: fragmentación no implica inestabilidad si la investidura crea una mayoría (la XIV aprobó tres PGE). Benítez, Pamies y Coller (borrador AECPA) tabla 2: el NEP no baja el consenso de las leyes autonómicas aprobadas. Bäck et al.: el modelo no explica las formaciones más largas, que dependen de partidos parias y compromisos preelectorales"},{"id":"R499","de":"P38","a":"P01","p":"-","m":"Repetir o acumular elecciones cansa y la movilización de los partidos rinde menos","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Kostelka, Krejčová, Sauger y Wuttke (2023) Comparative Political Studies, doi 10.1177/00104140231169020, tabla 1 modelos 1-4 (p. 20 del preprint de Essex), cálculo propio con la participación del Ministerio del Interior (esta nota, B.3) (correlacional (efectos fijos de país con PCSE, 22 democracias europeas 1939-2019, con dos experimentos naturales fuera de España) y descriptiva; UE (22 democracias europeas con España) y ES (repeticiones de 2016 y noviembre de 2019); lectura: texto completo (preprint) y datos completos). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente mide la frecuencia de elecciones, no la inestabilidad en sí, y una elección anticipada por sí sola no cambia la participación.","co":"Kostelka et al. modelo 1: las elecciones anticipadas no difieren de las ordinarias. El efecto decae y desaparece al quinto año"},{"id":"R514","de":"P23","a":"L48","p":"-","m":"Más oferta partidista no recupera la confianza y la de los partidos baja algo","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Torcal y Christmann (2021) Frontiers in Political Science 3:676672, tabla 1 (p. 7) (correlacional (probit multinivel, Eurobarómetro 1997-2019: 35 trimestres en el modelo de los partidos, 38 en el del Parlamento); ES; lectura: texto completo). Nivel en el inventario: DÉBIL. Vínculo: cumple (NEP electoral, confianza en partidos y Parlamento).","co":"Miller y Listhaug (1990): donde entran partidos nuevos que canalizan el descontento la confianza se recupera (Noruega, 1964-1986)"},{"id":"R520","de":"E37","a":"E01","p":"-","m":"Gravar más el capital baja la inversión y el capital por trabajador y con ellos el PIB","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Boscá, Doménech y Ferri (2017) Papeles de Economía Española 154 pp. 255-256 y 259 (gráfico 12) + Boscá, Doménech y Ferri (2013) Hacienda Pública Española 206 pp. 33-35 (figura 4) y apéndice A.2, A.30 y A.32, DOI 10.7866/HPE-RPE.13.3.2 + Fuster (2022) SERIEs 13 pp. 613-648 (p. 640 y fig. 6) (modelo calibrado (REMS, equilibrio general de economía pequeña y abierta, y modelo de economía cerrada de Fuster); ES (REMS parametrizado con datos españoles 1985T3-2009T4, Boscá et al. 2013 p. 33, y Fuster 2022 calibrado para España); lectura: texto completo). Nivel en el inventario: DÉBIL. Vínculo: aproximado: en REMS el tipo grava el rendimiento del capital físico (hace de Sociedades y de impuesto personal a la vez) y no grava los intereses de los bonos, y la recaudación vuelve en transferencias de cuantía fija (deducido de la regla fiscal A.32 para 2013, escrito en 2017 p. 255), no en gasto social. Fuster separa las rentas del capital de los hogares y gasta lo recaudado en consumo público. En los dos el signo descansa en el supuesto de que el capital responde al rendimiento neto.","co":"Yagan (2015) y Bach et al. (2023): la inversión no responde al impuesto sobre dividendos. Gil et al. (2017, España, causal): los impuestos directos cuestan menos PIB que los indirectos, al revés que el orden del modelo"},{"id":"R521","de":"E89","a":"E01","p":"+","m":"La inversión de las empresas es un componente del PIB por el lado del gasto","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable. SEC 2010 (PIB = consumo + formación bruta de capital + exportaciones − importaciones) (identidad contable).","co":""},{"id":"R522","de":"P30","a":"P23","p":"-","m":"Con menos escaños por circunscripción D'Hondt deja sin escaño a los terceros (efecto mecánico) y el votante y los partidos abandonan a quien no puede ganar (efecto psicológico), así que hay menos partidos efectivos en votos y aún menos en escaños","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Lago y Martínez i Coma (2024) EJPR doi 10.1111/1475-6765.12658 tabla 1 (p. 13) y pp. 6-17, Carey y Hix (2009) LSE PSPE WP 01-2009 tabla 3 (p. 38) y pp. 20-21, Montero y Fernández Esquer (2018) Política y Gobernanza 2 tablas 2 (p. 16) y 6 (p. 24), Lago (2021) Frontiers in Political Science 3:623709 tablas 4 y 6 (pp. 5-6) como mecanismo, Singer (2015) apéndice en línea (Dataverse 10.7910/DVN/AHKHTA) p. 2 sobre la exogeneidad (correlacional (panel de distritos con efectos fijos de distrito y de elección y variable dependiente retardada, 728 distrito-elección, y panel comparado con efectos fijos de país, 610 elecciones) y descriptiva; ES (52 distritos, generales 1977-2019) y comparado mundial con España (81 democracias 1945-2006); lectura: texto completo). Nivel en el inventario: APOYO. Vínculo: aproximado: la fuente española mide el NEP electoral de cada distrito y la reducción en escaños por subsistemas, no el NEP nacional de P23, y la nacional (Carey y Hix) es comparada y mide el NEP parlamentario.","co":"Lago y Martínez i Coma (2024) tabla 1 modelo 5: en los distritos de cinco escaños o menos la log magnitud no es significativa (0,043, e. t. 0,157) y un escaño más solo sube el NEP si el número resultante es par. Lago (2021) tabla 4: la log magnitud no explica el cambio del voto a Vox entre abril y noviembre de 2019 (0,23, e. t. 0,70), lo explica la viabilidad. Montero y Fernández Esquer (2018) p. 15: el sistema no frena la fragmentación de los partidos autonómicos con voto concentrado. Carey y Hix tabla 3 modelo 11: con efectos fijos el término lineal es ≈0 y el efecto está en las magnitudes bajas"},{"id":"R523","de":"S55","a":"P01","p":"+","m":"Tras un atentado grave sube la intención de votar y la participación (ansiedad, rechazo a la violencia y apoyo al sistema democrático)","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Montalvo (2011) «Voting after the bombing» (versión de trabajo, Universitat Pompeu Fabra), secc. 3.2 ecuación (5) + Balcells y Torrats-Espinosa (2018) PNAS 115(42): 10624-10629, DOI 10.1073/pnas.1800302115, fig. 1-2 (causal (diferencias en diferencias con el voto del CERA emitido antes del 11-M, y experimento natural con encuestas del CIS en curso durante 8 atentados de ETA); ES (generales de 2004, CIS 1989-1997); lectura: texto completo (Balcells y Torrats-Espinosa, sin el apéndice SI)). Nivel en el inventario: FIRME. Vínculo: cumple.","co":"Balcells y Torrats-Espinosa: miden intención declarada, no voto, y el efecto es indistinguible de cero si las víctimas son militares o policías"},{"id":"R526","de":"S57","a":"P01","p":"-","m":"Con la epidemia en el municipio vota menos gente, por miedo al contagio en el colegio electoral y no por culpar al gobierno","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Fernández-Navia, Polo-Muro y Tercero-Lucas (2021) European Journal of Political Economy 69: 102012, DOI 10.1016/j.ejpoleco.2021.102012, tablas 1-5 (causal (diferencias en diferencias, 251 municipios vascos, autonómicas 2001-2020); ES (País Vasco, 12/7/2020); lectura: texto completo (versión de PubMed Central, sin los apéndices C-F)). Nivel en el inventario: FIRME. Vínculo: cumple.","co":"El apoyo al partido del Gobierno vasco y al del Gobierno central no cambia cuando se controla la tendencia de cada municipio (tabla 1, cols. 4-6)"},{"id":"R527","de":"S58","a":"P68","p":"+","m":"Las ciudades con más asistentes a las marchas del 15M se desplazan a la izquierda de forma duradera, en parte por la red social en línea que nace de las protestas","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Casanueva Artís (2022) «Can chants in the street change politics’ tune? Evidence from the 15M movement in Spain», documento de trabajo (Paris School of Economics), secc. 5.2, tabla 3 (causal (variables instrumentales: el mal tiempo del día de la marcha, F de la primera etapa 28-36); ES (barómetros del CIS 2011-2019); lectura: texto completo del cuerpo (secc. 1-8) y apéndices C.2 y D.2). Nivel en el inventario: FIRME. Vínculo: aproximado: la fuente mide situarse en la mitad izquierda de la escala 1-10 y P68 es el tramo 1-4.","co":"Documento de trabajo sin revisión por pares. Compara ciudades con más y menos asistentes, no frente a no tener 15M"},{"id":"R528","de":"S58","a":"P46","p":"-","m":"Donde más gente marchó con el 15M se vota menos a la derecha radical años después, porque menos votantes de la derecha pasan a ella","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Casanueva Artís (2022) secc. 5.1, tabla 2 col. 4 y tabla E4 (causal (variables instrumentales a nivel de ciudad, },{"id":"R39","t":"R","c":1,"a":["R456","R472","R271","R115","R277"]},{"id":"B40","t":"B","c":1,"a":["R456","R477","R293","R115","R277"]},{"id":"R41","t":"R","c":1,"a":["R456","R478","R388","R115","R277"]},{"id":"R42","t":"R","c":1,"a":["R458","R040","R115","R277","R456","R448"]},{"id":"R43","t":"R","c":1,"a":["R347","R348","R271","R115","R277","R338"]},{"id":"B44","t":"B","c":1,"a":["R354","R087","R293","R115","R277","R338"]},{"id":"R45","t":"R","c":1,"a":["R476","R485","R374","R453","R459","R470"]},{"id":"R46","t":"R","c":1,"a":["R453","R459","R467","R481","R485","R374"]},{"id":"R47","t":"R","c":1,"a":["R458","R035","R271","R115","R277","R456","R448"]},{"id":"R48","t":"R","c":1,"a":["R458","R480","R485","R374","R453","R459","R471"]},{"id":"B49","t":"B","c":1,"a":["R349","R488","R170","R128","R115","R277","R338"]},{"id":"B50","t":"B","c":1,"a":["R164","R278","R453","R459","R470","R441","R445","R031"]}],"sintomas":["E22","E24","E26","E28","E31","E79","S24","S53","L51"]};
(function () {
  const svg = document.getElementById('lienzo'), lado = document.getElementById('lado');
  const NS = 'http://www.w3.org/2000/svg';
  document.getElementById('titulo').textContent = DATOS.titulo + ' · Mapa causal N2';
  const CONF = ['Conjetura', 'Baja', 'Media', 'Alta'];
  const col = Object.fromEntries(DATOS.clusters.map(c => [c.id, c.color]));
  const nomC = Object.fromEntries(DATOS.clusters.map(c => [c.id, c.nombre]));
  const nodo = Object.fromEntries(DATOS.nodos.map(n => [n.id, n]));

  // Disposicion determinista: clusters en un circulo grande, variables en circulos pequenos
  const R = 520, k = DATOS.clusters.length;
  DATOS.clusters.forEach((c, i) => {
    const ang = -Math.PI / 2 + 2 * Math.PI * i / k;
    c.x = R * Math.cos(ang); c.y = R * Math.sin(ang);
    const ns = DATOS.nodos.filter(n => n.c === c.id);
    const r = Math.max(46, 15 * ns.length / 2.2);
    c.r = r;
    ns.forEach((n, j) => {
      const a = ang + Math.PI + 2 * Math.PI * j / ns.length;   // el primero mira al centro
      n.x = c.x + r * Math.cos(a); n.y = c.y + r * Math.sin(a);
    });
  });

  function el(tag, attrs, padre) { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); (padre || svg).appendChild(e); return e; }
  const defs = el('defs', {});
  [['mas', '#2B6CB0'], ['menos', '#C05621']].forEach(([id, c]) => {
    const m = el('marker', { id: 'f-' + id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }, m);
  });
  const g = el('g', {});
  const gClu = el('g', {}, g), gAr = el('g', {}, g), gNo = el('g', {}, g);

  DATOS.clusters.forEach(c => {
    el('circle', { cx: c.x, cy: c.y, r: c.r + 34, fill: c.color, 'fill-opacity': .06, stroke: c.color, 'stroke-opacity': .25 }, gClu);
    const t = el('text', { x: c.x * 1.0, y: c.y + (c.y < 0 ? -(c.r + 42) : (c.r + 54)), 'text-anchor': 'middle', class: 'clu', fill: c.color }, gClu);
    t.textContent = c.id + ' · ' + c.nombre;
  });

  DATOS.aristas.forEach(a => {
    const p = nodo[a.de], q = nodo[a.a];
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1;
    const rq = 6 + Math.min(8, nodo[a.a].b / 12);
    const x2 = q.x - dx / d * (rq + 3), y2 = q.y - dy / d * (rq + 3);
    const mx = (p.x + x2) / 2 - dy * 0.12, my = (p.y + y2) / 2 + dx * 0.12;
    a.el = el('path', {
      d: `M${p.x},${p.y} Q${mx},${my} ${x2},${y2}`, fill: 'none',
      stroke: a.p === '+' ? '#2B6CB0' : '#C05621', 'stroke-width': 0.7 + a.c * 0.55, 'stroke-opacity': .55,
      'stroke-dasharray': a.c === 0 ? '2 4' : (a.q ? '7 3' : ''), 'marker-end': `url(#f-${a.p === '+' ? 'mas' : 'menos'})`
    }, gAr);
    a.el.style.cursor = 'pointer';
    a.el.addEventListener('click', ev => { ev.stopPropagation(); verArista(a); });
  });

  DATOS.nodos.forEach(n => {
    const r = 6 + Math.min(8, n.b / 12);
    n.g = el('g', {}, gNo);
    n.circ = el('circle', { cx: n.x, cy: n.y, r, fill: col[n.c], stroke: '#fff', 'stroke-width': 1.5 }, n.g);
    const c = DATOS.clusters.find(x => x.id === n.c);
    const fuera = Math.atan2(n.y - c.y, n.x - c.x), izq = Math.cos(fuera) < 0;
    const t = el('text', { x: n.x + Math.cos(fuera) * (r + 4), y: n.y + Math.sin(fuera) * (r + 4) + 3, 'text-anchor': izq ? 'end' : 'start', class: 'nodo' }, n.g);
    t.textContent = n.n.length > 34 ? n.n.slice(0, 33) + '…' : n.n;
    n.mk = el('text', { x: n.x, y: n.y - r - 3, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700 }, n.g);
    n.g.style.cursor = 'pointer';
    n.g.addEventListener('click', ev => { ev.stopPropagation(); verNodo(n); });
  });

  // Zoom y arrastre
  let vista = { x: -900, y: -820, w: 1800, h: 1640 };
  const pon = () => svg.setAttribute('viewBox', `${vista.x} ${vista.y} ${vista.w} ${vista.h}`);
  pon();
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const f = ev.deltaY > 0 ? 1.12 : 0.89, r = svg.getBoundingClientRect();
    const px = vista.x + vista.w * (ev.clientX - r.left) / r.width, py = vista.y + vista.h * (ev.clientY - r.top) / r.height;
    vista = { x: px - (px - vista.x) * f, y: py - (py - vista.y) * f, w: vista.w * f, h: vista.h * f }; pon();
  }, { passive: false });
  let arr = null;
  svg.addEventListener('pointerdown', ev => { arr = { x: ev.clientX, y: ev.clientY, v: { ...vista } }; svg.style.cursor = 'grabbing'; });
  window.addEventListener('pointermove', ev => {
    if (!arr) return; const r = svg.getBoundingClientRect();
    vista.x = arr.v.x - (ev.clientX - arr.x) * vista.w / r.width; vista.y = arr.v.y - (ev.clientY - arr.y) * vista.h / r.height; pon();
  });
  window.addEventListener('pointerup', () => { arr = null; svg.style.cursor = 'grab'; });
  svg.addEventListener('click', () => { sel = null; modo = null; pintar(); inicio(); });

  // Filtros y resaltado
  let sel = null;
  let modo = null;   // null | { tipo:'bucle', ar:Set, no:Set } | { tipo:'prop', paso:Map, signo:Map, ar:Set }
  const fConf = document.getElementById('fConf'), fDisp = document.getElementById('fDisp'), fBusca = document.getElementById('fBusca');
  const visible = a => (a.h ? +fConf.value === -1 : a.c >= Math.max(+fConf.value, 0)) && (!fDisp.checked || a.q);
  function pintar() {
    const txt = fBusca.value.trim().toLowerCase();
    let n = 0;
    const vecinos = new Set();
    DATOS.aristas.forEach(a => {
      const v = visible(a); if (v) n++;
      a.el.style.display = v ? '' : 'none';
      let enc;
      if (modo) enc = modo.ar.has(a.id);
      else { enc = !sel || a.de === sel || a.a === sel; if (sel && enc && v) { vecinos.add(a.de); vecinos.add(a.a); } }
      a.el.classList.toggle('apagado', !enc);
      a.el.setAttribute('stroke-opacity', modo && enc ? .95 : .55);
    });
    DATOS.nodos.forEach(x => {
      const busca = txt && !x.n.toLowerCase().includes(txt);
      let enc;
      if (modo && modo.tipo === 'bucle') enc = modo.no.has(x.id);
      else if (modo) enc = modo.paso.has(x.id);
      else enc = !sel || vecinos.has(x.id) || x.id === sel;
      x.g.classList.toggle('apagado', !enc || !!busca);
      const sg = modo && modo.tipo === 'prop' ? modo.signo.get(x.id) : undefined;
      x.mk.textContent = sg === undefined ? '' : sg > 0 ? '▲' : sg < 0 ? '▼' : '◆';
      x.mk.setAttribute('fill', sg > 0 ? '#2B6CB0' : sg < 0 ? '#C05621' : '#52606D');
    });
    document.getElementById('cuenta').textContent = `${DATOS.nodos.length} variables · ${n} de ${DATOS.aristas.length} relaciones`;
  }

  // Propagacion de signo por oleadas: que variables se mueven, en que sentido y en cuantos pasos,
  // si la variable de origen aumenta. Solo recorre las relaciones visibles con el filtro actual.
  // Si a una variable llegan en el mismo paso un empuje al alza y otro a la baja, se marca como ambigua (0).
  function propagar(origen, maxPasos) {
    const paso = new Map([[origen, 0]]), signo = new Map([[origen, 1]]), ar = new Set();
    let frente = [origen];
    for (let k = 1; k <= maxPasos && frente.length; k++) {
      const llegada = new Map();
      for (const u of frente) {
        const su = signo.get(u); if (su === 0) continue;
        for (const a of DATOS.aristas) {
          if (a.de !== u || !visible(a) || paso.has(a.a)) continue;
          const s = su * (a.p === '+' ? 1 : -1);
          ar.add(a.id);
          llegada.set(a.a, llegada.has(a.a) && llegada.get(a.a) !== s ? 0 : s);
        }
      }
      frente = [];
      for (const [id, s] of llegada) { paso.set(id, k); signo.set(id, s); frente.push(id); }
    }
    return { tipo: 'prop', paso, signo, ar };
  }
  function verPropagacion(n) {
    modo = propagar(n.id, 6); sel = null; pintar();
    const porPaso = {};
    for (const [id, k] of modo.paso) if (k > 0) (porPaso[k] = porPaso[k] || []).push(id);
    const fl = s => s > 0 ? '<span class="mas">▲ sube</span>' : s < 0 ? '<span class="menos">▼ baja</span>' : '◆ ambiguo';
    lado.innerHTML = `<h2>Si aumenta: ${esc(n.n)}</h2>
      <p class="leyenda">Recorrido por oleadas sobre las relaciones visibles (filtro de confianza actual). Indica sentido y número de pasos, no magnitud ni plazo. «Ambiguo»: llegan empujes contrarios en el mismo paso.</p>` +
      Object.keys(porPaso).map(k => `<h3>Paso ${k}</h3>` + porPaso[k].map(id => `<div class="rel" data-n="${id}">${fl(modo.signo.get(id))} · ${esc(nodo[id].n)}${DATOS.sintomas.includes(id) ? ' <span class="eti">síntoma</span>' : ''}</div>`).join('')).join('') +
      `<p><a href="#" id="volverN">Volver a la ficha</a></p>`;
    lado.querySelectorAll('[data-n]').forEach(d => d.addEventListener('click', () => { modo = null; verNodo(nodo[d.dataset.n]); }));
    document.getElementById('volverN').addEventListener('click', ev => { ev.preventDefault(); modo = null; verNodo(n); });
  }
  function verBucle(b) {
    const no = new Set(); b.a.forEach(id => { const a = DATOS.aristas.find(x => x.id === id); no.add(a.de); no.add(a.a); });
    modo = { tipo: 'bucle', ar: new Set(b.a), no }; sel = null; pintar();
    const ars = b.a.map(id => DATOS.aristas.find(x => x.id === id));
    lado.innerHTML = `<h2>${b.id} · ${b.t === 'R' ? 'Bucle de refuerzo' : 'Bucle de equilibrio'}</h2>
      <p><span class="eti">Confianza ${CONF[b.c]} (la de su relación más débil)</span></p>
      <p class="leyenda">${b.t === 'R' ? 'Amplifica un cambio en cualquiera de sus variables.' : 'Contrarresta un cambio en cualquiera de sus variables.'} El tipo se calcula: número ${b.t === 'R' ? 'par' : 'impar'} de relaciones negativas.</p>
      <h3>Cadena</h3>${ars.map(filaRel).join('')}<p><a href="#" id="volverI">Ver todos los bucles</a></p>`;
    enganchar();
    document.getElementById('volverI').addEventListener('click', ev => { ev.preventDefault(); modo = null; pintar(); inicio(); });
  }
  [fConf, fDisp].forEach(e => e.addEventListener('change', pintar));
  fBusca.addEventListener('input', pintar);

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const signo = p => p === '+' ? '<span class="mas">(+)</span>' : '<span class="menos">(−)</span>';
  function filaRel(a) {
    return `<div class="rel" data-id="${a.id}">${esc(nodo[a.de].n)} → ${signo(a.p)} ${esc(nodo[a.a].n)}<br><span class="eti">${a.h ? 'Hipótesis del analista' : a.k ? 'Contable' : CONF[a.c]}</span><span class="eti">${a.P}/${a.D}</span>${a.q ? '<span class="eti" style="color:#C05621;border-color:#C05621">disputada</span>' : ''}</div>`;
  }
  function enganchar() { lado.querySelectorAll('.rel').forEach(d => d.addEventListener('click', () => verArista(DATOS.aristas.find(a => a.id === d.dataset.id)))); }
  function verNodo(n) {
    sel = n.id; modo = null; pintar();
    const en = DATOS.aristas.filter(a => a.a === n.id && visible(a)), sa = DATOS.aristas.filter(a => a.de === n.id && visible(a));
    lado.innerHTML = `<h2>${esc(n.n)}</h2><p><span class="eti" style="color:${col[n.c]};border-color:${col[n.c]}">${esc(nomC[n.c])}</span><span class="eti">${esc(n.t)}</span></p>
      <p>${esc(n.d)}</p><p><b>Indicador:</b> ${esc(n.ind)}${n.f ? ' · <i>' + esc(n.f) + '</i>' : ''}</p>${n.du ? `<p><b>La controla:</b> ${esc(n.du)}</p>` : ''}
      <p class="leyenda">Intermediación ${n.b}/100 · participa en ${n.l} bucles (sin conjeturas)</p>
      <p><a href="#" id="simula"><b>¿Qué se mueve si esta variable aumenta?</b></a></p>
      <h3>Qué influye en ella (${en.length})</h3>${en.map(filaRel).join('') || '<p class="leyenda">Nada, con el filtro actual.</p>'}
      <h3>En qué influye (${sa.length})</h3>${sa.map(filaRel).join('') || '<p class="leyenda">Nada, con el filtro actual.</p>'}`;
    enganchar();
    document.getElementById('simula').addEventListener('click', ev => { ev.preventDefault(); verPropagacion(n); });
  }
  function verArista(a) {
    lado.innerHTML = `<h2>${a.id}</h2><p>${esc(nodo[a.de].n)} → ${signo(a.p)} ${esc(nodo[a.a].n)}</p>
      <p><span class="eti">${a.h ? 'Hipótesis del analista: sin afirmación ni fuente' : a.k ? 'Identidad contable' : 'Confianza ' + CONF[a.c]}</span><span class="eti">Percepción ${a.P}</span><span class="eti">Datos ${a.D}</span>${a.q ? '<span class="eti" style="color:#C05621;border-color:#C05621">disputada</span>' : ''}</p>
      <h3>Mecanismo</h3><p>${esc(a.m)}</p>${a.r ? `<h3>Retardo</h3><p>${esc(a.r)}</p>` : ''}
      ${a.ev ? `<h3>Evidencia</h3><p>${esc(a.ev)}</p>` : ''}${a.co ? `<h3>En contra</h3><p>${esc(a.co)}</p>` : ''}
      <p><a href="#" id="volver">Ver la variable de origen</a></p>`;
    document.getElementById('volver').addEventListener('click', ev => { ev.preventDefault(); verNodo(nodo[a.de]); });
  }
  function inicio() {
    lado.innerHTML = `<h2>Cómo leer el mapa</h2>
      <p>Cada punto es una variable; su tamaño indica cuánto hace de puente entre otras. Cada flecha es una relación causal hipotética.</p>
      <p class="leyenda"><span class="mas">Azul (+)</span>: si el origen aumenta, el destino tiende a ser mayor.<br><span class="menos">Naranja (−)</span>: si el origen aumenta, el destino tiende a ser menor.<br>Grosor: confianza. Punteada: conjetura. A trazos: disputada.</p>
      <p>Pulsa una variable o una flecha para ver su ficha. Rueda del ratón para acercar; arrastra para mover.</p>
      <h3>Dominios</h3><p class="leyenda">${DATOS.clusters.map(c => `<i style="background:${c.color}"></i>${esc(c.id)} · ${esc(c.nombre)}`).join('<br>')}</p>
      <h3>Bucles (${DATOS.bucles.length}, conjunto reducido)</h3>` +
      DATOS.bucles.map(b => `<div class="rel" data-b="${b.id}"><b>${b.id}</b> · ${b.t === 'R' ? 'refuerzo' : 'equilibrio'} · ${b.a.length} relaciones · <span class="eti">${CONF[b.c]}</span><br><span class="leyenda">${b.a.map(id => esc(nodo[DATOS.aristas.find(x => x.id === id).de].n)).join(' → ')}</span></div>`).join('');
    lado.querySelectorAll('[data-b]').forEach(d => d.addEventListener('click', ev => { ev.stopPropagation(); verBucle(DATOS.bucles.find(b => b.id === d.dataset.b)); }));
  }
  pintar(); inicio();
})();
</script>
